<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KL TIME Fast Kiosk</title>
  <meta name="theme-color" content="#081525">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:#081525;color:#fff}
    body{display:grid;place-items:center}
    .box{text-align:center;padding:24px}
    .logo{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:#fff;color:#081525;display:grid;place-items:center;font-weight:900;font-size:22px}
    .small{opacity:.72;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">KL</div>
    <b>กำลังเปิดหน้าสแกน...</b>
    <div class="small">KL TIME Fast Kiosk</div>
  </div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        const w=reg.active||reg.waiting||reg.installing;
        const u=String(w&&w.scriptURL||'');
        // Remove only the old V5.2 root-scoped Fast Kiosk worker.
        // Do NOT touch /fast/sw-fast.js or the admin sw.js.
        if(u.endsWith('/kl-time/sw-fast.js')){
          await reg.unregister();
        }
      }
    }
  }catch(e){}
  const q=location.search||'';
  location.replace('./fast/'+q);
})();
</script>
</body>
</html>
