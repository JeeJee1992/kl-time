<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#374151">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>KL TIME · บัญชีและเงินเดือน · V2.3</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--dark:#1f2937;--dark2:#374151;--green:#047857;--red:#b91c1c;--amber:#b45309;--blue:#1d4ed8;--shadow:0 8px 25px rgba(17,24,39,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.red-t{color:var(--red)}.green-t{color:var(--green)}.amber-t{color:var(--amber)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:13px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:22px}.sub{font-size:12px;color:var(--muted)}
.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--text)}input:focus,select:focus,textarea:focus{outline:none;border-color:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.17)}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--dark);color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}.btn.small{padding:6px 9px;font-size:12px}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.top-left,.top-right{display:flex;align-items:center;gap:10px}.mini-logo{width:35px;height:35px;border-radius:10px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.top-name{font-weight:900}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1500px;margin:0 auto}.side{min-height:calc(100vh - 62px);background:#fff;border-right:1px solid var(--line);padding:13px 9px;position:sticky;top:62px;align-self:start}.side button{display:flex;width:100%;border:0;background:transparent;padding:10px 11px;border-radius:9px;text-align:left;font-weight:750;color:#374151;margin:2px 0}.side button.active{background:#374151;color:#fff}.content{padding:16px;min-width:0}.mobile-nav{display:none;gap:7px;overflow:auto;padding-bottom:8px}.mobile-nav button{white-space:nowrap;border:0;background:#e5e7eb;padding:8px 11px;border-radius:9px;font-weight:800}.mobile-nav button.active{background:#374151;color:#fff}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 2px 10px rgba(17,24,39,.035)}.stat .num{font-size:27px;font-weight:900;margin-top:4px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:11px;flex-wrap:wrap}.section-head h2{font-size:18px;margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:9px;align-items:end}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left;vertical-align:middle}th{background:#4b5563;color:#fff;position:sticky;top:0;z-index:2;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#e5e7eb;font-weight:800;font-size:10px}.badge.green{background:#d1fae5;color:#065f46}.badge.red{background:#fee2e2;color:#991b1b}.badge.amber{background:#fef3c7;color:#92400e}.badge.blue{background:#dbeafe;color:#1e40af}.notice{padding:10px 11px;border-radius:10px;border:1px solid #d1d5db;background:#f9fafb;font-size:12px;line-height:1.45}.notice.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:3}.matrix td:first-child{background:#fff}.matrix th:first-child{z-index:4}.day-cell{min-width:64px;text-align:center}.day-cell .t{font-size:10px;line-height:1.25}.cell-off{background:#f3f4f6}.cell-holiday{background:#e0f2fe}.cell-leave{background:#ede9fe}.cell-absent{background:#fee2e2}.cell-late{background:#fef3c7}.cell-present{background:#ecfdf5}
.money{font-variant-numeric:tabular-nums;text-align:right}.pay-total{font-size:22px;font-weight:900}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:0;background:#e5e7eb;color:#111827;border-radius:9px;padding:8px 11px;font-weight:800}.tabs button.active{background:#374151;color:#fff}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.62);z-index:100;display:grid;place-items:center;padding:14px}.modal-card{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:17px}.modal-card.narrow{width:min(500px,100%)}.photo{max-width:100%;border-radius:12px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;z-index:150;font-size:12px;max-width:min(520px,90vw)}.loader{position:fixed;inset:0;background:rgba(255,255,255,.68);display:none;place-items:center;z-index:200}.loader.show{display:grid}.spin{width:40px;height:40px;border:5px solid #d1d5db;border-top-color:#374151;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.video{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.face-guide{position:absolute;inset:10% 27%;border:3px solid rgba(255,255,255,.9);border-radius:45%;pointer-events:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.content{padding:10px}.top-name{font-size:13px}.top-right .who{display:none}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.settings-grid,.filters{grid-template-columns:1fr}.card{padding:11px}.top{padding:0 9px}.top .btn.scanlink{display:none}}
@media print{.top,.side,.mobile-nav,.no-print{display:none!important}.layout{display:block}.content{padding:0}.card{box-shadow:none;border:0}.table-wrap{overflow:visible}table{min-width:0}th{position:static}.matrix th:first-child,.matrix td:first-child{position:static}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader" class="loader"><div class="spin"></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const state={token:localStorage.getItem('kl_admin_token')||'',user:null,settings:null,tab:'dashboard',adminDate:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}),month:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),payPeriod:'1',payMonth:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),faceModels:false,stream:null,employees:[]};
function backendUrl(){return String(window.KL_BACKEND_URL||'').trim()}function validBackendUrl(u){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(String(u||''))}
const rpcPending=new Map();function dec(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))))}
window.addEventListener('message',ev=>{try{const h=new URL(ev.origin).hostname;if(!(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.googleusercontent.com')))return}catch(e){return}const d=ev.data;if(!d||d.type!=='KL_RPC_B64')return;let m;try{m=dec(d.data)}catch(e){return}const p=rpcPending.get(m.id);if(!p)return;clearTimeout(p.timer);p.frame.remove();rpcPending.delete(m.id);loader(false);m.ok?p.resolve(m.result):p.reject(new Error(m.error&&m.error.message?m.error.message:'Server error'))});
function api(fn,...args){if(!navigator.onLine)return Promise.reject(new Error('ต้องเชื่อมอินเทอร์เน็ตเพื่อใช้หลังบ้าน'));const url=backendUrl();if(!validBackendUrl(url))return Promise.reject(new Error('ยังไม่ได้ตั้ง Backend URL'));loader(true);return new Promise((resolve,reject)=>{const id='rpc_'+Date.now()+'_'+Math.random().toString(36).slice(2),frame=document.createElement('iframe');frame.name='f_'+id;frame.style.display='none';document.body.appendChild(frame);const timer=setTimeout(()=>{rpcPending.delete(id);frame.remove();loader(false);reject(new Error('Server ตอบกลับช้า กรุณาลองใหม่'))},30000);rpcPending.set(id,{resolve,reject,timer,frame});const form=document.createElement('form');form.method='POST';form.action=url;form.target=frame.name;form.style.display='none';const add=(n,v)=>{const x=document.createElement('textarea');x.name=n;x.value=v;form.appendChild(x)};add('requestId',id);add('payload',JSON.stringify({id,action:fn,args}));document.body.appendChild(form);form.submit();form.remove()})}
function loader(v){$('#loader').classList.toggle('show',!!v)}function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}function err(e){toast(e.message||String(e))}
function fmtMoney(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}function roleLabel(r){return r==='owner'?'เจ้าของระบบ':'ฝ่ายบัญชี'}function wageLabel(t){return t==='monthly'?'รายเดือน':'รายวัน'}
function renderLogin(){state.user=null;$('#app').innerHTML=`<div class="login-shell"><div class="login"><div class="brand"><div class="logo">KL</div><div><h1>KL TIME</h1><div class="sub">บัญชี · เวลาเข้างาน · เงินเดือน</div></div></div><div class="notice" style="margin:16px 0">หน้านี้สำหรับ OWNER / ฝ่ายบัญชี<br>หน้าสแกนพนักงานใช้ <b>fast.html</b></div><div class="field"><label>รหัสผู้ใช้</label><input id="uid" autocomplete="username" placeholder="เช่น ACC001"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div><button class="btn full" onclick="login()">เข้าสู่ระบบ</button><a href="./fast.html" style="display:block;text-align:center;margin-top:13px;color:#374151">เปิดหน้าสแกนเข้า–ออก</a></div></div>`}
async function login(){try{const r=await api('login',$('#uid').value.trim(),$('#pin').value.trim());if(!['owner','accounting'].includes(r.user.role)){try{await api('logout',r.token)}catch(e){}throw new Error('บัญชีนี้ไม่มีสิทธิ์หลังบ้าน')}state.token=r.token;state.user=r.user;state.settings=r.settings;localStorage.setItem('kl_admin_token',r.token);renderAdmin()}catch(e){err(e)}}
async function logout(){try{await api('logout',state.token)}catch(e){}localStorage.removeItem('kl_admin_token');state.token='';renderLogin()}
function topbar(){return `<div class="top"><div class="top-left"><div class="mini-logo">KL</div><div><div class="top-name">${esc(state.settings?.companyName||'KL TIME')}</div><div class="sub">ระบบบัญชีและเวลาพนักงาน</div></div></div><div class="top-right"><a class="btn secondary scanlink" href="./fast.html">เปิดหน้าสแกน</a><span class="who"><b>${esc(state.user?.name||'')}</b> · ${roleLabel(state.user?.role)}</span><button class="btn secondary" onclick="logout()">ออก</button></div></div>`}
const menus=[['dashboard','ภาพรวม'],['records','ลงเวลารายวัน'],['timesheet','ตารางเวลารายเดือน'],['payroll','เงินเดือน'],['employees','พนักงาน'],['leave','ลา / วันหยุด'],['reports','รายงาน'],['audit','ประวัติแก้ไข'],['settings','ตั้งค่า']];
function navButtons(cls=''){return menus.map(([k,l])=>`<button class="${state.tab===k?'active':''} ${cls}" onclick="state.tab='${k}';renderAdmin()">${l}</button>`).join('')}
function renderAdmin(){$('#app').innerHTML=topbar()+`<div class="layout"><aside class="side">${navButtons()}</aside><main class="content"><div class="mobile-nav">${navButtons()}</div><div id="content"></div></main></div>`;loadTab()}
async function loadTab(){try{if(state.tab==='dashboard')return loadDashboard();if(state.tab==='records')return loadRecords();if(state.tab==='timesheet')return loadTimesheet();if(state.tab==='payroll')return loadPayroll();if(state.tab==='employees')return loadEmployees();if(state.tab==='leave')return loadLeave();if(state.tab==='reports')return loadReports();if(state.tab==='audit')return loadAudit();if(state.tab==='settings')return loadSettings()}catch(e){err(e)}}
async function loadDashboard(){state.adminDate=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const d=await api('getAdminDashboard',state.token,state.adminDate);$('#content').innerHTML=`<div class="stats grid"><div class="card stat"><div class="muted">พนักงาน</div><div class="num">${d.stats.total}</div></div><div class="card stat"><div class="muted">เข้างานแล้ว</div><div class="num green-t">${d.stats.checkedIn}</div></div><div class="card stat"><div class="muted">ยังไม่เข้า</div><div class="num red-t">${d.stats.notIn}</div></div><div class="card stat"><div class="muted">มาสาย</div><div class="num amber-t">${d.stats.late}</div></div><div class="card stat"><div class="muted">ออกแล้ว</div><div class="num">${d.stats.checkedOut}</div></div></div><div class="card" style="margin-top:12px"><div class="section-head"><h2>ลงเวลาวันนี้ · ${esc(d.date)}</h2><div class="row"><button class="btn secondary" onclick="state.tab='payroll';renderAdmin()">ไปเงินเดือน</button><button class="btn secondary" onclick="state.tab='timesheet';renderAdmin()">ดูตารางเดือน</button></div></div>${attendanceTable(d.rows,d.date)}</div>`}
function attendanceTable(rows,date){return `<div class="table-wrap"><table><thead><tr><th>พนักงาน</th><th>ฝ่าย</th><th>เข้า</th><th>ออก</th><th>สาย</th><th>สถานะ</th><th>โหมด</th><th>หลักฐาน</th><th>แก้ไข</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="sub">${esc(r.userId)}</div></td><td>${esc(r.department)}</td><td>${esc(r.checkIn||'--:--')}</td><td>${esc(r.checkOut||'--:--')}</td><td>${r.lateMinutes?`<span class="badge amber">${r.lateMinutes} นาที</span>`:'0'}</td><td><span class="badge ${r.checkIn?'green':'red'}">${esc(r.status)}</span></td><td>${modeBadge(r.inMode,r.outMode)}</td><td>${r.inPhotoId?`<button class="btn secondary small" onclick="viewPhoto('${r.inPhotoId}')">เข้า</button>`:''} ${r.outPhotoId?`<button class="btn secondary small" onclick="viewPhoto('${r.outPhotoId}')">ออก</button>`:''}</td><td><button class="btn secondary small" onclick="editAttendance('${encodeURIComponent(JSON.stringify({userId:r.userId,name:r.name,date,checkIn:r.checkIn,checkOut:r.checkOut}))}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`}
function modeBadge(a,b){const s=[a,b].filter(Boolean).join(' / ');if(!s)return '-';if(s.includes('fallback'))return '<span class="badge amber">PIN สำรอง</span>';if(s.includes('offline'))return '<span class="badge blue">ออฟไลน์</span>';if(s.includes('fast'))return '<span class="badge green">Fast Face</span>';return esc(s)}
async function loadRecords(){const d=await api('getAdminAttendance',state.token,state.adminDate);$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>รายการลงเวลารายวัน</h2><div class="row no-print"><input id="dayPick" type="date" value="${esc(state.adminDate)}" style="width:auto"><button class="btn" onclick="state.adminDate=$('#dayPick').value;loadRecords()">ดู</button><button class="btn secondary" onclick="exportAttendanceCsv()">Excel/CSV</button></div></div>${attendanceTable(d.rows,d.date)}</div>`;window.__dayRows=d.rows;window.__dayDate=d.date}
async function viewPhoto(id){try{const src=await api('getEvidencePhoto',state.token,id);modal(`<div class="section-head"><h2>รูปหลักฐาน</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><img class="photo" src="${src}">`)}catch(e){err(e)}}
function editAttendance(enc){const r=JSON.parse(decodeURIComponent(enc));modal(`<div class="section-head"><h2>แก้เวลา · ${esc(r.name)}</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="notice warn">ทุกการแก้ไขถูกบันทึกใน Audit Log</div><div class="field"><label>วันที่</label><input id="eDate" value="${esc(r.date)}" disabled></div><div class="settings-grid"><div class="field"><label>เวลาเข้า</label><input id="eIn" type="time" value="${esc(r.checkIn||'')}"></div><div class="field"><label>เวลาออก</label><input id="eOut" type="time" value="${esc(r.checkOut||'')}"></div></div><div class="field"><label>เหตุผล</label><textarea id="eReason" rows="3"></textarea></div><button class="btn full" onclick="saveEdit('${esc(r.userId)}')">บันทึก</button>`,true)}
async function saveEdit(uid){try{await api('adminEditAttendance',state.token,{userId:uid,date:$('#eDate').value,checkIn:$('#eIn').value,checkOut:$('#eOut').value,reason:$('#eReason').value});closeModal();toast('บันทึกแล้ว');loadRecords()}catch(e){err(e)}}
async function loadTimesheet(){const d=await api('getTimesheetMonth',state.token,state.month);$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>ตารางเวลารายเดือน</h2><div class="row no-print"><input id="monthPick" type="month" value="${esc(state.month)}" style="width:auto"><button class="btn" onclick="state.month=$('#monthPick').value;loadTimesheet()">ดูเดือน</button><button class="btn secondary" onclick="window.print()">พิมพ์</button></div></div><div class="notice">สี: เขียว=มาทำงาน · เหลือง=สาย · แดง=ขาด/ไม่มีเวลาเข้า · ม่วง=ลา · ฟ้า=วันหยุดประเพณี · เทา=วันหยุดประจำ</div><div class="table-wrap" style="margin-top:10px"><table class="matrix"><thead><tr><th>พนักงาน</th>${d.days.map(x=>`<th style="text-align:center">${Number(x.slice(-2))}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="sub">${esc(r.userId)} · ${esc(r.department)}</div></td>${r.days.map(c=>timesheetCell(c)).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function timesheetCell(c){
  const cls={
    present:'cell-present',
    late:'cell-late',
    absent:'cell-absent',
    leave:'cell-leave',
    holiday:'cell-holiday',
    off:'cell-off',
  }[c.kind]||'';

  let t='';
  if(c.in||c.out)t=`<div class="t">${esc(c.in||'--')}<br>${esc(c.out||'--')}</div>`;
  else if(c.kind==='leave')t='<div class="t">ลา</div>';
  else if(c.kind==='holiday')t='<div class="t">หยุด</div>';
  else if(c.kind==='off')t='<div class="t">พ</div>';
  else if(c.kind==='absent')t='<div class="t">ข</div>';

  return `<td class="day-cell ${cls}" title="${esc(c.label||'')}">${t}</td>`;
}
function periodDates(){const [y,m]=state.payMonth.split('-').map(Number),last=new Date(y,m,0).getDate();if(state.payPeriod==='1')return {from:`${state.payMonth}-01`,to:`${state.payMonth}-15`};if(state.payPeriod==='2')return {from:`${state.payMonth}-16`,to:`${state.payMonth}-${String(last).padStart(2,'0')}`};return {from:`${state.payMonth}-01`,to:`${state.payMonth}-${String(last).padStart(2,'0')}`}}

const FACE_BASE='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';async function loadFaceModels(){if(state.faceModels)return;if(!window.faceapi)throw new Error('โหลด Face API ไม่สำเร็จ');loader(true);try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_BASE),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_BASE),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_BASE)]);state.faceModels=true}finally{loader(false)}}async function startCam(){stopCam();state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:540}},audio:false});$('#faceCam').srcObject=state.stream;await $('#faceCam').play().catch(()=>{})}function stopCam(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}}async function faceSample(){const o=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5}),all=await faceapi.detectAllFaces($('#faceCam'),o).withFaceLandmarks().withFaceDescriptors();if(all.length!==1)throw new Error(all.length?'กรุณาอยู่ในกล้องเพียง 1 คน':'ไม่พบใบหน้า');return Array.from(all[0].descriptor)}

dayRow('${x.date}')">ลบ</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">ยังไม่มีวันหยุด</td></tr>'}</tbody></table></div></div>`}
function leaveForm(){const r=window.__leaveRange;modal(`<div class="section-head"><h2>บันทึกการลา</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>พนักงาน</label><select id="lUid">${state.employees.filter(x=>x.active).map(x=>`<option value="${x.userId}">${esc(x.name)} (${x.userId})</option>`).join('')}</select></div><div class="field"><label>ประเภทลา</label><select id="lType"><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option><option>ลาคลอด</option><option>อื่นๆ</option></select></div><div class="settings-grid"><div class="field"><label>เริ่ม</label><input id="lFrom" type="date" value="${r.from}"></div><div class="field"><label>สิ้นสุด</label><input id="lTo" type="date" value="${r.from}"></div></div><div class="field"><label>สถานะ</label><select id="lStatus"><option>อนุมัติ</option><option>รออนุมัติ</option><option>ยกเลิก</option></select></div><label><input id="lPaid" type="checkbox" style="width:auto"> เป็นวันลาที่มีค่าจ้าง</label><div class="field"><label>หมายเหตุ</label><input id="lNote"></div><button class="btn full" onclick="saveLeaveRow()">บันทึก</button>`,true)}async function saveLeaveRow(){try{await api('saveLeave',state.token,{userId:$('#lUid').value,type:$('#lType').value,from:$('#lFrom').value,to:$('#lTo').value,paid:$('#lPaid').checked,status:$('#lStatus').value,note:$('#lNote').value});closeModal();loadLeave()}catch(e){err(e)}}async function deleteLeaveRow(id){if(!confirm('ลบรายการลา?'))return;try{await api('deleteLeave',state.token,id);loadLeave()}catch(e){err(e)}}
function holidayForm(){const year=state.month.slice(0,4);modal(`<div class="section-head"><h2>เพิ่มวันหยุดประเพณี</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>วันที่</label><input id="hDate" type="date" value="${year}-01-01"></div><div class="field"><label>ชื่อวันหยุด</label><input id="hName"></div><label><input id="hPaid" type="checkbox" style="width:auto" checked> มีค่าจ้าง</label><br><label><input id="hLocked" type="checkbox" style="width:auto" checked> ล็อกเป็นวันหยุดในตารางเวลา</label><button class="btn full" style="margin-top:12px" onclick="saveHolidayRow()">บันทึก</button>`,true)}async function saveHolidayRow(){try{await api('saveHoliday',state.token,{date:$('#hDate').value,name:$('#hName').value,paid:$('#hPaid').checked,locked:$('#hLocked').checked});closeModal();loadLeave()}catch(e){err(e)}}async function deleteHolidayRow(d){if(!confirm('ลบวันหยุด '+d+' ?'))return;try{await api('deleteHoliday',state.token,d);loadLeave()}catch(e){err(e)}}
async function loadReports(){const p=periodDates(),d=await api('getPayrollSummary',state.token,p.from,p.to),deps={};d.rows.forEach(r=>{const k=r.department||'ไม่ระบุ';if(!deps[k])deps[k]={employees:0,present:0,absent:0,late:0,net:0};deps[k].employees++;deps[k].present+=r.presentDays;deps[k].absent+=r.absentDays;deps[k].late+=r.lateMinutes;deps[k].net+=r.netPay});$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>รายงานสรุป</h2><div class="row no-print"><input id="repMonth" type="month" value="${state.payMonth}" style="width:auto"><select id="repPeriod" style="width:auto"><option value="1" ${state.payPeriod==='1'?'selected':''}>1–15</option><option value="2" ${state.payPeriod==='2'?'selected':''}>16–สิ้นเดือน</option><option value="all" ${state.payPeriod==='all'?'selected':''}>ทั้งเดือน</option></select><button class="btn" onclick="state.payMonth=$('#repMonth').value;state.payPeriod=$('#repPeriod').value;loadReports()">ดู</button><button class="btn secondary" onclick="exportPayrollCsv()">ส่งออก</button></div></div><div class="table-wrap"><table><thead><tr><th>ฝ่าย</th><th>คน</th><th>วันมาทำงานรวม</th><th>ขาดรวม</th><th>สายรวม(นาที)</th><th>เงินสุทธิรวม</th></tr></thead><tbody>${Object.entries(deps).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${v.employees}</td><td>${v.present}</td><td>${v.absent}</td><td>${v.late}</td><td class="money"><b>${fmtMoney(v.net)}</b></td></tr>`).join('')}</tbody></table></div></div>`;window.__payroll=d}
async function loadAudit(){const rows=await api('getAuditLog',state.token,300);$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>ประวัติแก้ไข / Audit Log</h2></div>${rows.map(r=>`<div class="notice" style="margin:6px 0"><b>${esc(r.action)}</b> · ${esc(r.timestamp)}<br><span class="muted">โดย ${esc(r.actor)} · ${esc(r.target)} — ${esc(r.detail)}</span></div>`).join('')||'<div class="muted">ไม่มีประวัติ</div>'}</div>`}
function loadSettings(){const s=state.settings;$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>ตั้งค่าระบบ</h2></div><div class="settings-grid"><div class="field"><label>ชื่อสถานที่</label><input id="sName" value="${esc(s.siteName||'')}"></div><div class="field"><label>รัศมี GPS (เมตร)</label><input id="sRadius" type="number" value="${s.radiusM||100}"></div><div class="field"><label>เวลาเข้า</label><input id="sIn" type="time" value="${esc(s.shiftIn||'08:30')}"></div><div class="field"><label>เวลาออก</label><input id="sOut" type="time" value="${esc(s.shiftOut||'18:00')}"></div><div class="field"><label>ผ่อนผันสาย (นาที)</label><input id="sGrace" type="number" value="${s.graceMin||5}"></div><div class="field"><label>วันหยุดประจำ</label><select id="sOff">${['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'].map((x,i)=>`<option value="${i}" ${Number(s.weeklyOff)===i?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>ละติจูด</label><input id="sLat" value="${esc(s.siteLat||'')}"></div><div class="field"><label>ลองจิจูด</label><input id="sLng" value="${esc(s.siteLng||'')}"></div></div><div class="row"><button class="btn secondary" onclick="fillGps()">ใช้ GPS ปัจจุบัน</button><button class="btn" onclick="saveSettings()">บันทึก</button></div></div>`}
function fillGps(){navigator.geolocation?.getCurrentPosition(p=>{$('#sLat').value=p.coords.latitude;$('#sLng').value=p.coords.longitude;toast('อ่าน GPS แล้ว')},()=>toast('อ่าน GPS ไม่ได้'),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}async function saveSettings(){try{const r=await api('saveSettings',state.token,{siteName:$('#sName').value,radiusM:$('#sRadius').value,shiftIn:$('#sIn').value,shiftOut:$('#sOut').value,graceMin:$('#sGrace').value,weeklyOff:$('#sOff').value,siteLat:$('#sLat').value,siteLng:$('#sLng').value});state.settings=r.settings;toast('บันทึกแล้ว')}catch(e){err(e)}}
function exportCsv(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportAttendanceCsv(){const d=window.__dayDate||state.adminDate,rows=window.__dayRows||[];exportCsv(`KL_TIME_${d}.csv`,[['วันที่','รหัส','ชื่อ','ฝ่าย','เข้า','ออก','สาย','สถานะ'],...rows.map(r=>[d,r.userId,r.name,r.department,r.checkIn,r.checkOut,r.lateMinutes,r.status])])}function exportPayrollCsv(){const d=window.__payroll;if(!d)return toast('ยังไม่มีข้อมูล');exportCsv(`KL_PAYROLL_${d.from}_${d.to}.csv`,[['รอบ','รหัส','ชื่อ','ฝ่าย','ประเภท','วันมาทำงาน','วันจ่าย(รายวัน)','ขาด','ลา','สาย(นาที)','OT(ชม.)','ฐาน','OT','เพิ่ม','หัก','สุทธิ'],...d.rows.map(r=>[`${d.from} ถึง ${d.to}`,r.userId,r.name,r.department,wageLabel(r.wageType),r.presentDays,r.payableDays,r.absentDays,r.leaveDays,r.lateMinutes,r.otHours,r.basePay,r.otPay,r.addition,r.deduction,r.netPay])])}
function modal(html,narrow=false){closeModal();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modal-card ${narrow?'narrow':''}">${html}</div></div>`)}function closeModal(){stopCam();$('#modal')?.remove()}
async function boot(){if(!validBackendUrl(backendUrl())){renderLogin();toast('ตรวจ config.js: Backend URL ไม่ถูกต้อง');return}if(state.token){try{const r=await api('resumeSession',state.token);if(['owner','accounting'].includes(r.user.role)){state.user=r.user;state.settings=r.settings;renderAdmin();return}}catch(e){}localStorage.removeItem('kl_admin_token');state.token=''}renderLogin()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));boot();
</script>
</body>
