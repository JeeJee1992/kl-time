<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="robots" content="noindex,nofollow">

<title>KL TIME · บัญชีและเงินเดือน · V3.2</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--dark:#1f2937;--dark2:#374151;--green:#047857;--red:#b91c1c;--amber:#b45309;--blue:#1d4ed8;--shadow:0 8px 25px rgba(17,24,39,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.red-t{color:var(--red)}.green-t{color:var(--green)}.amber-t{color:var(--amber)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:13px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:22px}.sub{font-size:12px;color:var(--muted)}
.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--text)}input:focus,select:focus,textarea:focus{outline:none;border-color:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.17)}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--dark);color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:var(--amber)}.btn.small{padding:6px 9px;font-size:12px}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.top-left,.top-right{display:flex;align-items:center;gap:10px}.mini-logo{width:35px;height:35px;border-radius:10px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.top-name{font-weight:900}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1500px;margin:0 auto}.side{min-height:calc(100vh - 62px);background:#fff;border-right:1px solid var(--line);padding:13px 9px;position:sticky;top:62px;align-self:start}.side button{display:flex;width:100%;border:0;background:transparent;padding:10px 11px;border-radius:9px;text-align:left;font-weight:750;color:#374151;margin:2px 0}.side button.active{background:#374151;color:#fff}.content{padding:16px;min-width:0}.mobile-nav{display:none;gap:7px;overflow:auto;padding-bottom:8px}.mobile-nav button{white-space:nowrap;border:0;background:#e5e7eb;padding:8px 11px;border-radius:9px;font-weight:800}.mobile-nav button.active{background:#374151;color:#fff}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 2px 10px rgba(17,24,39,.035)}.stat .num{font-size:27px;font-weight:900;margin-top:4px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:11px;flex-wrap:wrap}.section-head h2{font-size:18px;margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:9px;align-items:end}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left;vertical-align:middle}th{background:#4b5563;color:#fff;position:sticky;top:0;z-index:2;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#e5e7eb;font-weight:800;font-size:10px}.badge.green{background:#d1fae5;color:#065f46}.badge.red{background:#fee2e2;color:#991b1b}.badge.amber{background:#fef3c7;color:#92400e}.badge.blue{background:#dbeafe;color:#1e40af}.notice{padding:10px 11px;border-radius:10px;border:1px solid #d1d5db;background:#f9fafb;font-size:12px;line-height:1.45}.notice.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:3}.matrix td:first-child{background:#fff}.matrix th:first-child{z-index:4}.day-cell{min-width:64px;text-align:center}.day-cell .t{font-size:10px;line-height:1.25}.cell-off{background:#f3f4f6}.cell-holiday{background:#e0f2fe}.cell-leave{background:#ede9fe}.cell-absent{background:#fee2e2}.cell-late{background:#fef3c7}.cell-present{background:#ecfdf5}
.personal-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.personal-name{font-size:20px;font-weight:900}
.personal-meta{font-size:12px;color:#6b7280;margin-top:3px}
.personal-table{min-width:1200px}
.personal-table th{text-align:center}
.personal-grid thead tr:first-child th{background:#dff6e3;color:#111827;border-bottom:1px solid #86efac}
.personal-grid thead tr:nth-child(2) th{background:#ecfdf5;color:#111827}
.personal-grid td{font-variant-numeric:tabular-nums}
.personal-grid td:nth-child(1),.personal-grid td:nth-child(2){font-weight:700}
.personal-grid .small{font-size:12px;color:#6b7280}
.timecard-wrap{overflow-x:auto;border:1px solid #16a34a}
.timecard{width:100%;min-width:1180px;border-collapse:collapse;table-layout:fixed;background:#fff}
.timecard th,.timecard td{border:1px solid #16a34a;padding:4px 5px;text-align:center;font-size:12px;height:28px}
.timecard thead th{background:#dcfce7;color:#111827;font-weight:800}
.timecard .device-cell{text-align:left;font-weight:800}
.timecard .date-cell{width:68px}
.timecard .week-cell{width:58px}
.timecard .time-cell{width:62px}
.timecard .late-in{color:#dc2626;font-weight:900}
.timecard .blank-day{background:#f8fafc}
.timecard .status-absent{background:#fff1f2;color:#dc2626;font-weight:900}
.timecard .status-leave{background:#f5f3ff;color:#6d28d9;font-weight:800}
.timecard .status-holiday{background:#eff6ff;color:#0369a1;font-weight:800}
.timecard .status-off{background:#f3f4f6;color:#4b5563;font-weight:800}
.timecard .status-text{white-space:normal;line-height:1.2;font-size:11px}

.timecard-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 10px}
.timecard-title .employee{font-weight:900;font-size:18px}
.timecard-title .meta{font-size:12px;color:#6b7280}

.personal-table td{text-align:center;font-variant-numeric:tabular-nums}
.personal-table td:first-child,.personal-table td:nth-child(2){text-align:left}
.personal-table .row-present{background:#f0fdf4}
.personal-table .row-late{background:#fffbeb}
.personal-table .row-absent{background:#fff1f2}
.personal-table .row-leave{background:#f5f3ff}
.personal-table .row-holiday{background:#f0f9ff}
.personal-table .row-off{background:#f9fafb}
.personal-status{font-weight:800}
.personal-status.present{color:#047857}
.personal-status.late{color:#b45309}
.personal-status.absent{color:#b91c1c}
.personal-status.leave{color:#6d28d9}
.personal-status.holiday{color:#0369a1}
.personal-status.off{color:#4b5563}

.money{font-variant-numeric:tabular-nums;text-align:right}.pay-total{font-size:22px;font-weight:900}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:0;background:#e5e7eb;color:#111827;border-radius:9px;padding:8px 11px;font-weight:800}.tabs button.active{background:#374151;color:#fff}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.62);z-index:100;display:grid;place-items:center;padding:14px}.modal-card{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:17px}.modal-card.narrow{width:min(500px,100%)}.photo{max-width:100%;border-radius:12px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;z-index:150;font-size:12px;max-width:min(520px,90vw)}.loader{position:fixed;inset:0;background:rgba(255,255,255,.68);display:none;place-items:center;z-index:200}.loader.show{display:grid}.spin{width:40px;height:40px;border:5px solid #d1d5db;border-top-color:#374151;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.video{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.face-guide{position:absolute;inset:10% 27%;border:3px solid rgba(255,255,255,.9);border-radius:45%;pointer-events:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.content{padding:10px}.top-name{font-size:13px}.top-right .who{display:none}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.settings-grid,.filters{grid-template-columns:1fr}.card{padding:11px}.top{padding:0 9px}.top .btn.scanlink{display:none}}
@media print{.top,.side,.mobile-nav,.no-print{display:none!important}.layout{display:block}.content{padding:0}.card{box-shadow:none;border:0}.table-wrap{overflow:visible}table{min-width:0}th{position:static}.matrix th:first-child,.matrix td:first-child{position:static}.personal-table{min-width:0}.personal-table th,.personal-table td{font-size:10px;padding:6px 5px}.personal-head{margin-top:0}.stats{grid-template-columns:repeat(6,1fr)!important}.stat .num{font-size:17px!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader" class="loader"><div class="spin"></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const state={token:localStorage.getItem('kl_admin_token')||'',user:null,settings:null,tab:'dashboard',adminDate:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}),month:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),personalMonth:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),personalUserId:'',payPeriod:'1',payMonth:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),faceModels:false,stream:null,employees:[],branches:[],branchFilter:'ALL'};
function backendUrl(){return String(window.KL_BACKEND_URL||'').trim()}function validBackendUrl(u){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(String(u||''))}
const rpcPending=new Map();function dec(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))))}
window.addEventListener('message',ev=>{try{const h=new URL(ev.origin).hostname;if(!(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.googleusercontent.com')))return}catch(e){return}const d=ev.data;if(!d||d.type!=='KL_RPC_B64')return;let m;try{m=dec(d.data)}catch(e){return}const p=rpcPending.get(m.id);if(!p)return;clearTimeout(p.timer);p.frame.remove();rpcPending.delete(m.id);loader(false);m.ok?p.resolve(m.result):p.reject(new Error(m.error&&m.error.message?m.error.message:'Server error'))});
function api(fn,...args){if(!navigator.onLine)return Promise.reject(new Error('ต้องเชื่อมอินเทอร์เน็ตเพื่อใช้หลังบ้าน'));const url=backendUrl();if(!validBackendUrl(url))return Promise.reject(new Error('ยังไม่ได้ตั้ง Backend URL'));loader(true);return new Promise((resolve,reject)=>{const id='rpc_'+Date.now()+'_'+Math.random().toString(36).slice(2),frame=document.createElement('iframe');frame.name='f_'+id;frame.style.display='none';document.body.appendChild(frame);const timer=setTimeout(()=>{rpcPending.delete(id);frame.remove();loader(false);reject(new Error('Server ตอบกลับช้า กรุณาลองใหม่'))},30000);rpcPending.set(id,{resolve,reject,timer,frame});const form=document.createElement('form');form.method='POST';form.action=url;form.target=frame.name;form.style.display='none';const add=(n,v)=>{const x=document.createElement('textarea');x.name=n;x.value=v;form.appendChild(x)};add('requestId',id);add('payload',JSON.stringify({id,action:fn,args}));document.body.appendChild(form);form.submit();form.remove()})}
function loader(v){$('#loader').classList.toggle('show',!!v)}function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}function err(e){toast(e.message||String(e))}
function fmtMoney(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}function roleLabel(r){return r==='owner'?'เจ้าของระบบ':'ฝ่ายบัญชี'}function wageLabel(t){return t==='monthly'?'รายเดือน':'รายวัน'}

function branchOptions(includeAll=true,value=state.branchFilter){
  const a=(includeAll?`<option value="ALL" ${value==='ALL'?'selected':''}>ทุกสาขา</option>`:'');
  return a+(state.branches||[]).filter(x=>x.active!==false).map(x=>`<option value="${esc(x.code)}" ${value===x.code?'selected':''}>${esc(x.name)} (${esc(x.code)})</option>`).join('');
}
function branchName(code){const b=(state.branches||[]).find(x=>x.code===String(code||'').toUpperCase());return b?b.name:(code||'ยังไม่กำหนด')}
function changeBranchFilter(v){state.branchFilter=String(v||'ALL').toUpperCase();loadTab()}
async function loadBranchesMeta(){try{state.branches=await api('getBranches',state.token)}catch(e){state.branches=[]}}

function renderLogin(){state.user=null;$('#app').innerHTML=`<div class="login-shell"><div class="login"><div class="brand"><div class="logo">KL</div><div><h1>KL TIME</h1><div class="sub">บัญชี · เวลาเข้างาน · เงินเดือน</div></div></div><div class="notice" style="margin:16px 0">หน้านี้สำหรับ OWNER / ฝ่ายบัญชี<br>หน้าสแกนพนักงานใช้ <b>fast.html</b></div><div class="field"><label>รหัสผู้ใช้</label><input id="uid" autocomplete="username" placeholder="เช่น ACC001"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div><button class="btn full" onclick="login()">เข้าสู่ระบบ</button><a href="./fast.html" style="display:block;text-align:center;margin-top:13px;color:#374151">เปิดหน้าสแกนเข้า–ออก</a></div></div>`}
async function login(){try{const r=await api('login',$('#uid').value.trim(),$('#pin').value.trim());if(!['owner','accounting'].includes(r.user.role)){try{await api('logout',r.token)}catch(e){}throw new Error('บัญชีนี้ไม่มีสิทธิ์หลังบ้าน')}state.token=r.token;state.user=r.user;state.settings=r.settings;localStorage.setItem('kl_admin_token',r.token);await loadBranchesMeta();renderAdmin()}catch(e){err(e)}}
async function logout(){try{await api('logout',state.token)}catch(e){}localStorage.removeItem('kl_admin_token');state.token='';renderLogin()}
function topbar(){return `<div class="top"><div class="top-left"><div class="mini-logo">KL</div><div><div class="top-name">${esc(state.settings?.companyName||'KL TIME')}</div><div class="sub">ระบบบัญชีและเวลาพนักงาน</div></div></div><div class="top-right"><select onchange="changeBranchFilter(this.value)" style="width:auto;min-width:170px">${branchOptions(true,state.branchFilter)}</select><a class="btn secondary scanlink" href="./fast.html">เปิดหน้าสแกน</a><span class="who"><b>${esc(state.user?.name||'')}</b> · ${roleLabel(state.user?.role)}</span><button class="btn secondary" onclick="logout()">ออก</button></div></div>`}
const menus=[['dashboard','ภาพรวม'],['records','ลงเวลารายวัน'],['timesheet','ตารางเวลารายเดือน'],['personal','ตารางเวลารายบุคคล'],['payroll','เงินเดือน'],['employees','พนักงาน'],['leave','ลา / วันหยุด'],['reports','รายงาน'],['audit','ประวัติแก้ไข'],['settings','ตั้งค่า']];
function navButtons(cls=''){return menus.map(([k,l])=>`<button class="${state.tab===k?'active':''} ${cls}" onclick="state.tab='${k}';renderAdmin()">${l}</button>`).join('')}
function renderAdmin(){$('#app').innerHTML=topbar()+`<div class="layout"><aside class="side">${navButtons()}</aside><main class="content"><div class="mobile-nav">${navButtons()}</div><div id="content"></div></main></div>`;loadTab()}
async function loadTab(){try{if(state.tab==='dashboard')return loadDashboard();if(state.tab==='records')return loadRecords();if(state.tab==='timesheet')return loadTimesheet();if(state.tab==='personal')return loadPersonalTimesheet();if(state.tab==='payroll')return loadPayroll();if(state.tab==='employees')return loadEmployees();if(state.tab==='leave')return loadLeave();if(state.tab==='reports')return loadReports();if(state.tab==='audit')return loadAudit();if(state.tab==='settings')return loadSettings()}catch(e){err(e)}}
async function loadDashboard(){state.adminDate=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const d=await api('getAdminDashboard',state.token,state.adminDate,state.branchFilter);$('#content').innerHTML=`<div class="stats grid"><div class="card stat"><div class="muted">พนักงาน</div><div class="num">${d.stats.total}</div></div><div class="card stat"><div class="muted">เข้างานแล้ว</div><div class="num green-t">${d.stats.checkedIn}</div></div><div class="card stat"><div class="muted">ยังไม่เข้า</div><div class="num red-t">${d.stats.notIn}</div></div><div class="card stat"><div class="muted">มาสาย</div><div class="num amber-t">${d.stats.late}</div></div><div class="card stat"><div class="muted">ออกแล้ว</div><div class="num">${d.stats.checkedOut}</div></div></div><div class="card" style="margin-top:12px"><div class="section-head"><h2>ลงเวลาวันนี้ · ${esc(d.date)}</h2><div class="row"><button class="btn secondary" onclick="state.tab='payroll';renderAdmin()">ไปเงินเดือน</button><button class="btn secondary" onclick="state.tab='timesheet';renderAdmin()">ดูตารางเดือน</button></div></div>${attendanceTable(d.rows,d.date)}</div>`}
function attendanceTable(rows,date){return `<div class="table-wrap"><table><thead><tr><th>พนักงาน</th><th>สาขา</th><th>ฝ่าย</th><th>เข้า</th><th>ออก</th><th>สาย</th><th>สถานะ</th><th>โหมด</th><th>หลักฐาน</th><th>แก้ไข</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="sub">${esc(r.userId)}</div></td><td>${esc(r.branchName||branchName(r.branchCode))}</td><td>${esc(r.department)}</td><td>${esc(r.checkIn||'--:--')}</td><td>${esc(r.checkOut||'--:--')}</td><td>${r.lateMinutes?`<span class="badge amber">${r.lateMinutes} นาที</span>`:'0'}</td><td><span class="badge ${r.checkIn?'green':'red'}">${esc(r.status)}</span></td><td>${modeBadge(r.inMode,r.outMode)}</td><td>${r.inPhotoId?`<button class="btn secondary small" onclick="viewPhoto('${r.inPhotoId}')">เข้า</button>`:''} ${r.outPhotoId?`<button class="btn secondary small" onclick="viewPhoto('${r.outPhotoId}')">ออก</button>`:''}</td><td><button class="btn secondary small" onclick="editAttendance('${encodeURIComponent(JSON.stringify({userId:r.userId,name:r.name,date,checkIn:r.checkIn,checkOut:r.checkOut}))}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`}
function modeBadge(a,b){const s=[a,b].filter(Boolean).join(' / ');if(!s)return '-';if(s.includes('fallback'))return '<span class="badge amber">PIN สำรอง</span>';if(s.includes('offline'))return '<span class="badge blue">ออฟไลน์</span>';if(s.includes('fast'))return '<span class="badge green">Fast Face</span>';return esc(s)}

function timesheetCell(c){
  const cls={
    present:'cell-present',
    late:'cell-late',
    absent:'cell-absent',
    leave:'cell-leave',
    holiday:'cell-holiday',
    off:'cell-off',
  }[c.kind]||'';

  let t='';
  if(c.in||c.out)t=`<div class="t">${esc(c.in||'--')}<br>${esc(c.out||'--')}</div>`;
  else if(c.kind==='leave')t='<div class="t">ลา</div>';
  else if(c.kind==='holiday')t='<div class="t">หยุด</div>';
  else if(c.kind==='off')t='<div class="t">พ</div>';
  else if(c.kind==='absent')t='<div class="t">ข</div>';

  return `<td class="day-cell ${cls}" title="${esc(c.label||'')}">${t}</td>`;
}

function thaiWeekday(dateKey){
  const n=new Date(dateKey+'T12:00:00+07:00').getDay();
  return ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'][n]||'';
}
function thaiDateKey(dateKey){
  const [y,m,d]=String(dateKey||'').split('-').map(Number);
  if(!y||!m||!d)return dateKey||'';
  return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y+543}`;
}
function personalKindLabel(c){

  if(c.kind==='late')return `มาทำงาน · สาย ${c.late||0} นาที`;
  if(c.kind==='absent')return 'ขาด';
  if(c.kind==='leave')return c.label||'ลา';
  if(c.kind==='holiday')return c.label||'วันหยุดประเพณี';
  if(c.kind==='off')return 'วันหยุดประจำ';
  return '';
}

function safeExcelSheetName_(value,used){
  let s=String(value||'พนักงาน')
    .replace(/[\\\/\?\*\[\]\:]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  if(!s)s='พนักงาน';
  s=s.slice(0,31);

  let base=s,n=2;
  while(used.has(s)){
    const suffix='_'+n++;
    s=base.slice(0,31-suffix.length)+suffix;
  }
  used.add(s);
  return s;
}

function addEmployeeTimecardSheet_(wb,employee,days,month,sheetName){
  const ws=wb.addWorksheet(sheetName,{
    pageSetup:{
      orientation:'landscape',
      fitToPage:true,
      fitToWidth:1,
      fitToHeight:1,
      margins:{left:0.25,right:0.25,top:0.35,bottom:0.35,header:0.1,footer:0.1}
    }
  });

  // ข้อมูลพนักงานด้านบน
  ws.getCell('A1').value='รหัสพนักงาน';
  ws.getCell('B1').value=employee.userId||'';
  ws.getCell('A2').value='ชื่อ';
  ws.getCell('B2').value=employee.name||'';
  ws.getCell('A3').value='ฝ่าย';
  ws.getCell('B3').value=employee.department||'';
  ws.getCell('A4').value='เดือน';
  ws.getCell('B4').value=month||'';
  ws.getCell('D1').value='สาขา';
  ws.getCell('E1').value=employee.branchName||branchName(employee.branchCode)||'';
  ws.getCell('D1').font={bold:true};
  ['A1','A2','A3','A4'].forEach(a=>ws.getCell(a).font={bold:true});

  // Header ตามบัตรเวลาเดิม
  ws.mergeCells('A6:B6');
  ws.mergeCells('C6:D6');
  ws.mergeCells('E6:F6');
  ws.mergeCells('G6:H6');
  ws.mergeCells('I6:J6');
  ws.mergeCells('K6:L6');
  ws.mergeCells('M6:N6');
  ws.mergeCells('O6:P6');

  ws.getCell('A6').value=`รหัสพนักงาน: ${employee.userId||''}`;
  ws.getCell('C6').value='Time1';
  ws.getCell('E6').value='Time2';
  ws.getCell('G6').value='Overtime';
  ws.getCell('K6').value='Time1';
  ws.getCell('M6').value='Time2';
  ws.getCell('O6').value='Overtime';

  const subHeaders=['Date','Week','In','Out','In','Out','In','Out','Date','Week','In','Out','In','Out','In','Out'];
  subHeaders.forEach((v,i)=>ws.getCell(7,i+1).value=v);

  const wdShort=(dateKey)=>{
    if(!dateKey)return '';
    const n=new Date(dateKey+'T12:00:00+07:00').getDay();
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]||'';
  };
  const md=(dateKey)=>{
    if(!dateKey)return '';
    const p=String(dateKey).split('-');
    return `${p[1]}-${p[2]}`;
  };
  const statusText=(c)=>{
    if(!c)return '';
    if(c.kind==='absent')return 'ขาด';
    if(c.kind==='leave')return String(c.label||'ลา').replace(/^ลา\s*·?\s*/,'ลา ');
    if(c.kind==='holiday')return String(c.label||'วันหยุดประเพณี').replace(/^วันหยุด\s*·\s*/,'');
    if(c.kind==='off')return 'วันหยุดประจำ';
    return '';
  };

  const GREEN='FF16A34A';
  const HEADER_FILL='FFDCFCE7';
  const ABSENT_FILL='FFFFF1F2';
  const LEAVE_FILL='FFF5F3FF';
  const HOLIDAY_FILL='FFEFF6FF';
  const OFF_FILL='FFF3F4F6';
  const RED='FFDC2626';
  const PURPLE='FF6D28D9';
  const BLUE='FF0369A1';
  const GRAY='FF4B5563';

  const setStatusCell=(row,col,c)=>{
    const text=statusText(c);
    if(!text)return;

    ws.mergeCells(row,col,row,col+1);
    const cell=ws.getCell(row,col);
    cell.value=text;
    cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    cell.font={bold:true};

    if(c.kind==='absent'){
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:ABSENT_FILL}};
      cell.font={bold:true,color:{argb:RED}};
    }else if(c.kind==='leave'){
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:LEAVE_FILL}};
      cell.font={bold:true,color:{argb:PURPLE}};
    }else if(c.kind==='holiday'){
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:HOLIDAY_FILL}};
      cell.font={bold:true,color:{argb:BLUE}};
    }else if(c.kind==='off'){
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:OFF_FILL}};
      cell.font={bold:true,color:{argb:GRAY}};
    }
  };

  const writeDay=(row,startCol,c)=>{
    if(!c)return;

    ws.getCell(row,startCol).value=md(c.date);
    ws.getCell(row,startCol+1).value=wdShort(c.date);

    if(c.in){
      ws.getCell(row,startCol+2).value=String(c.in)+(Number(c.late||0)>0?'*':'');
      ws.getCell(row,startCol+3).value=c.out||'';

      if(Number(c.late||0)>0){
        ws.getCell(row,startCol+2).font={bold:true,color:{argb:RED}};
      }
      return;
    }

    setStatusCell(row,startCol+2,c);
  };

  // 1-15 ซ้าย / 16-31 ขวา
  for(let i=0;i<16;i++){
    const row=8+i;
    const leftDay=i+1;
    const rightDay=i+16;

    const left=(days||[]).find(x=>Number(x.day)===leftDay);
    const right=(days||[]).find(x=>Number(x.day)===rightDay);

    if(leftDay<=15)writeDay(row,1,left);
    writeDay(row,9,right);
  }

  // รูปแบบตาราง
  for(let r=6;r<=23;r++){
    for(let c=1;c<=16;c++){
      const cell=ws.getCell(r,c);
      cell.border={
        top:{style:'thin',color:{argb:GREEN}},
        left:{style:'thin',color:{argb:GREEN}},
        bottom:{style:'thin',color:{argb:GREEN}},
        right:{style:'thin',color:{argb:GREEN}}
      };
      if(!cell.alignment)cell.alignment={horizontal:'center',vertical:'middle'};
    }
  }

  for(let r=6;r<=7;r++){
    for(let c=1;c<=16;c++){
      const cell=ws.getCell(r,c);
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:HEADER_FILL}};
      cell.font={bold:true,color:{argb:'FF111827'}};
      cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    }
  }
  ws.getCell('A6').alignment={horizontal:'left',vertical:'middle'};

  for(let r=1;r<=4;r++){
    ws.getCell(r,1).alignment={horizontal:'left'};
    ws.getCell(r,2).alignment={horizontal:'left'};
  }

  const widths=[10,9,9,9,9,9,9,9,10,9,9,9,9,9,9,9];
  widths.forEach((w,i)=>ws.getColumn(i+1).width=w);
  ws.getRow(6).height=22;
  ws.getRow(7).height=22;
  for(let r=8;r<=23;r++)ws.getRow(r).height=21;

  ws.views=[{state:'frozen',ySplit:7}];
  return ws;
}

async function downloadExcelWorkbook_(wb,filename){
  const buffer=await wb.xlsx.writeBuffer();
  const blob=new Blob(
    [buffer],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function exportAllEmployeesTimecardExcel(){
  if(!window.ExcelJS)return toast('ระบบ Excel ยังโหลดไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');

    wb.created=new Date();

    const used=new Set();

    rows.forEach(emp=>{
      const sheetName=safeExcelSheetName_(
        `${emp.userId||''} ${emp.name||''}`.trim(),

      );

        wb,
        emp,
        emp.days||[],
        d.month||month,

      );

    await downloadExcelWorkbook_(wb,`KL_TIME_พนักงานทุกคน_${d.month||month}.xlsx`);

" style="margin-top:14px" onclick="savePayProfile('${uid}')">บันทึกค่าจ้าง</button>`,true);togglePayFields()}
function togglePayFields(){const t=$('#pType')?.value;$('#dailyFields')?.classList.toggle('hidden',t!=='daily');$('#monthlyFields')?.classList.toggle('hidden',t!=='monthly')}
async function savePayProfile(uid){try{await api('savePayrollProfile',state.token,{userId:uid,startDate:$('#pStart').value,wageType:$('#pType').value,dailyRate:$('#pDaily')?.value||0,monthlySalary:$('#pMonthly')?.value||0,payCycle:$('#pCycle')?.value||'period',period1Pay:$('#pP1')?.value||0,period2Pay:$('#pP2')?.value||0,otRate:$('#pOt').value,weeklyOffPaid:$('#pWeekly').checked,holidayPaid:$('#pHoliday').checked});closeModal();toast('บันทึกค่าจ้างแล้ว');loadEmployees()}catch(e){err(e)}}
function resetPinDialog(uid){const r=state.employees.find(x=>x.userId===uid);modal(`<div class="section-head"><h2>รีเซ็ต PIN · ${esc(r.name)}</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>PIN ใหม่ 4–8 หลัก</label><input id="newPin" type="password" inputmode="numeric"></div><button class="btn full" onclick="resetPin('${uid}')">บันทึก</button>`,true)}async function resetPin(uid){try{await api('resetEmployeePin',state.token,uid,$('#newPin').value);closeModal();toast('รีเซ็ต PIN แล้ว')}catch(e){err(e)}}async function toggleEmp(uid,a){if(!confirm((a?'เปิด':'ปิด')+'ใช้งาน '+uid+' ?'))return;try{await api('setEmployeeActive',state.token,uid,a);loadEmployees()}catch(e){err(e)}}
const FACE_BASE='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';async function loadFaceModels(){if(state.faceModels)return;if(!window.faceapi)throw new Error('โหลด Face API ไม่สำเร็จ');loader(true);try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_BASE),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_BASE),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_BASE)]);state.faceModels=true}finally{loader(false)}}async function startCam(){stopCam();state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:540}},audio:false});$('#faceCam').srcObject=state.stream;await $('#faceCam').play().catch(()=>{})}function stopCam(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}}async function faceSample(){const o=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5}),all=await faceapi.detectAllFaces($('#faceCam'),o).withFaceLandmarks().withFaceDescriptors();if(all.length!==1)throw new Error(all.length?'กรุณาอยู่ในกล้องเพียง 1 คน':'ไม่พบใบหน้า');return Array.from(all[0].descriptor)}
async function faceEnroll(uid){const r=state.employees.find(x=>x.userId===uid);try{await loadFaceModels();state.faceEnroll={uid,name:r.name,samples:[]};modal(`<div class="section-head"><h2>ลงทะเบียนใบหน้า · ${esc(r.name)}</h2><button class="btn secondary" onclick="stopCam();closeModal()">ปิด</button></div><div class="notice warn">เก็บ 3 ตัวอย่าง: มองตรง → ซ้ายเล็กน้อย → ขวาเล็กน้อย</div><div class="video" style="margin-top:10px"><video id="faceCam" autoplay playsinline muted></video><div class="face-guide"></div></div><div id="faceMsg" class="notice" style="margin-top:10px">ครั้งที่ 1/3 · มองตรง</div><button id="faceBtn" class="btn green full" style="margin-top:10px" onclick="captureEnroll()">จับภาพครั้งที่ 1</button>`);await startCam()}catch(e){stopCam();err(e)}}async function captureEnroll(){const f=state.faceEnroll,b=$('#faceBtn'),m=$('#faceMsg');try{b.disabled=true;m.textContent='กำลังอ่านใบหน้า...';f.samples.push(await faceSample());if(f.samples.length<3){m.textContent=f.samples.length===1?'ครั้งที่ 2/3 · หันซ้ายเล็กน้อย':'ครั้งที่ 3/3 · หันขวาเล็กน้อย';b.textContent='จับภาพครั้งที่ '+(f.samples.length+1);b.disabled=false;return}m.textContent='กำลังบันทึก...';await api('saveFaceTemplate',state.token,f.uid,f.samples);stopCam();closeModal();toast('ลงทะเบียนใบหน้าแล้ว');loadEmployees()}catch(e){m.textContent=e.message||String(e);b.disabled=false}}
async function loadLeave(){const y=Number(state.month.slice(0,4)),m=Number(state.month.slice(5)),last=new Date(y,m,0).getDate(),from=state.month+'-01',to=state.month+'-'+String(last).padStart(2,'0');const [leaves,holidays,emps]=await Promise.all([api('getLeaves',state.token,from,to),api('getHolidays',state.token,String(y)),api('getEmployees',state.token,state.branchFilter)]);state.employees=emps;const visibleLeaves=leaves.filter(x=>emps.some(e=>e.userId===x.userId));window.__leaveRange={from,to};$('#content').innerHTML=`<div class="tabs no-print"><button class="active">การลาและวันหยุด</button></div><div class="card" style="margin-top:10px"><div class="section-head"><h2>การลา</h2><div class="row"><input id="leaveMonth" type="month" value="${state.month}" style="width:auto"><button class="btn secondary" onclick="state.month=$('#leaveMonth').value;loadLeave()">ดูเดือน</button><button class="btn" onclick="leaveForm()">+ บันทึกลา</button></div></div><div class="table-wrap"><table><thead><tr><th>พนักงาน</th><th>ประเภท</th><th>ช่วงวันที่</th><th>ค่าจ้าง</th><th>สถานะ</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>${visibleLeaves.map(x=>{const e=emps.find(z=>z.userId===x.userId);return `<tr><td>${esc(e?.name||x.userId)}<div class="sub">${esc(x.userId)}</div></td><td>${esc(x.type)}</td><td>${esc(x.from)} ถึง ${esc(x.to)}</td><td>${x.paid?'มี':'ไม่มี'}</td><td>${esc(x.status)}</td><td>${esc(x.note)}</td><td><button class="btn red small" onclick="deleteLeaveRow('${x.id}')">ลบ</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">ไม่มีรายการ</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:12px"><div class="section-head"><h2>วันหยุดประเพณี ${y+543}</h2><button class="btn" onclick="holidayForm()">+ เพิ่มวันหยุด</button></div><div class="table-wrap"><table><thead><tr><th>วันที่</th><th>ชื่อ</th><th>มีค่าจ้าง</th><th>ล็อก</th><th></th></tr></thead><tbody>${holidays.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${x.paid?'ใช่':'ไม่'}</td><td>${x.locked?'ใช่':'ไม่'}</td><td><button class="btn red small" onclick="deleteHolidayRow('${x.date}')">ลบ</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">ยังไม่มีวันหยุด</td></tr>'}</tbody></table></div></div>`}
function leaveForm(){const r=window.__leaveRange;modal(`<div class="section-head"><h2>บันทึกการลา</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>พนักงาน</label><select id="lUid">${state.employees.filter(x=>x.active).map(x=>`<option value="${x.userId}">${esc(x.name)} (${x.userId})</option>`).join('')}</select></div><div class="field"><label>ประเภทลา</label><select id="lType"><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option><option>ลาคลอด</option><option>อื่นๆ</option></select></div><div class="settings-grid"><div class="field"><label>เริ่ม</label><input id="lFrom" type="date" value="${r.from}"></div><div class="field"><label>สิ้นสุด</label><input id="lTo" type="date" value="${r.from}"></div></div><div class="field"><label>สถานะ</label><select id="lStatus"><option>อนุมัติ</option><option>รออนุมัติ</option><option>ยกเลิก</option></select></div><label><input id="lPaid" type="checkbox" style="width:auto"> เป็นวันลาที่มีค่าจ้าง</label><div class="field"><label>หมายเหตุ</label><input id="lNote"></div><button class="btn full" onclick="saveLeaveRow()">บันทึก</button>`,true)}async function saveLeaveRow(){try{await api('saveLeave',state.token,{userId:$('#lUid').value,type:$('#lType').value,from:$('#lFrom').value,to:$('#lTo').value,paid:$('#lPaid').checked,status:$('#lStatus').value,note:$('#lNote').value});closeModal();loadLeave()}catch(e){err(e)}}async function deleteLeaveRow(id){if(!confirm('ลบรายการลา?'))return;try{await api('deleteLeave',state.token,id);loadLeave()}catch(e){err(e)}}
function holidayForm(){const year=state.month.slice(0,4);modal(`<div class="section-head"><h2>เพิ่มวันหยุดประเพณี</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>วันที่</label><input id="hDate" type="date" value="${year}-01-01"></div><div class="field"><label>ชื่อวันหยุด</label><input id="hName"></div><label><input id="hPaid" type="checkbox" style="width:auto" checked> มีค่าจ้าง</label><br><label><input id="hLocked" type="checkbox" style="width:auto" checked> ล็อกเป็นวันหยุดในตารางเวลา</label><button class="btn full" style="margin-top:12px" onclick="saveHolidayRow()">บันทึก</button>`,true)}async function saveHolidayRow(){try{await api('saveHoliday',state.token,{date:$('#hDate').value,name:$('#hName').value,paid:$('#hPaid').checked,locked:$('#hLocked').checked});closeModal();loadLeave()}catch(e){err(e)}}async function deleteHolidayRow(d){if(!confirm('ลบวันหยุด '+d+' ?'))return;try{await api('deleteHoliday',state.token,d);loadLeave()}catch(e){err(e)}}
async function loadReports(){const p=periodDates(),d=await api('getPayrollSummary',state.token,p.from,p.to,state.branchFilter),deps={};d.rows.forEach(r=>{const k=r.department||'ไม่ระบุ';if(!deps[k])deps[k]={employees:0,present:0,absent:0,late:0,net:0};deps[k].employees++;deps[k].present+=r.presentDays;deps[k].absent+=r.absentDays;deps[k].late+=r.lateMinutes;deps[k].net+=r.netPay});$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>รายงานสรุป</h2><div class="row no-print"><input id="repMonth" type="month" value="${state.payMonth}" style="width:auto"><select id="repPeriod" style="width:auto"><option value="1" ${state.payPeriod==='1'?'selected':''}>1–15</option><option value="2" ${state.payPeriod==='2'?'selected':''}>16–สิ้นเดือน</option><option value="all" ${state.payPeriod==='all'?'selected':''}>ทั้งเดือน</option></select><button class="btn" onclick="state.payMonth=$('#repMonth').value;state.payPeriod=$('#repPeriod').value;loadReports()">ดู</button><button class="btn secondary" onclick="exportPayrollCsv()">ส่งออก</button></div></div><div class="table-wrap"><table><thead><tr><th>ฝ่าย</th><th>คน</th><th>วันมาทำงานรวม</th><th>ขาดรวม</th><th>สายรวม(นาที)</th><th>เงินสุทธิรวม</th></tr></thead><tbody>${Object.entries(deps).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${v.employees}</td><td>${v.present}</td><td>${v.absent}</td><td>${v.late}</td><td class="money"><b>${fmtMoney(v.net)}</b></td></tr>`).join('')}</tbody></table></div></div>`;window.__payroll=d}
async function loadAudit(){const rows=await api('getAuditLog',state.token,300);$('#content').innerHTML=`<div class="card"><div class="section-head"><h2>ประวัติแก้ไข / Audit Log</h2></div>${rows.map(r=>`<div class="notice" style="margin:6px 0"><b>${esc(r.action)}</b> · ${esc(r.timestamp)}<br><span class="muted">โดย ${esc(r.actor)} · ${esc(r.target)} — ${esc(r.detail)}</span></div>`).join('')||'<div class="muted">ไม่มีประวัติ</div>'}</div>`}
async function loadSettings(){try{state.branches=await api('getBranches',state.token);$('#content').innerHTML=`<div class="card"><div class="section-head"><div><h2>ตั้งค่าสาขา</h2><div class="sub">แต่ละสาขาตั้ง GPS เวลาเข้างาน วันหยุดประจำ และผ่อนผันสายแยกกัน</div></div><button class="btn" onclick="newBranchDialog()">+ เพิ่มสาขา</button></div><div class="notice">Fast Kiosk แต่ละเครื่องต้องเลือกสาขาให้ตรงกับสถานที่จริง</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-top:12px">${(state.branches||[]).map((b,i)=>`<div class="card"><div class="section-head"><div><h2>${esc(b.name)}</h2><div class="sub">รหัส ${esc(b.code)}</div></div><span class="badge ${b.active?'green':'red'}">${b.active?'ใช้งาน':'ปิด'}</span></div><div class="settings-grid"><div class="field"><label>ชื่อสาขา</label><input id="bn${i}" value="${esc(b.name)}"></div><div class="field"><label>รัศมี GPS (เมตร)</label><input id="br${i}" type="number" value="${Number(b.radiusM||100)}"></div><div class="field"><label>เวลาเข้า</label><input id="bi${i}" type="time" value="${esc(b.shiftIn||'08:30')}"></div><div class="field"><label>เวลาออก</label><input id="bo${i}" type="time" value="${esc(b.shiftOut||'18:00')}"></div><div class="field"><label>ผ่อนผันสาย (นาที)</label><input id="bg${i}" type="number" value="${Number(b.graceMin||0)}"></div><div class="field"><label>วันหยุดประจำ</label><select id="bw${i}">${['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'].map((x,n)=>`<option value="${n}" ${Number(b.weeklyOff)===n?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>ละติจูด</label><input id="blat${i}" value="${esc(b.lat||'')}"></div><div class="field"><label>ลองจิจูด</label><input id="blng${i}" value="${esc(b.lng||'')}"></div></div><label><input id="ba${i}" type="checkbox" style="width:auto" ${b.active?'checked':''}> เปิดใช้งาน</label><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="fillBranchGps(${i})">ใช้ GPS ปัจจุบัน</button><button class="btn" onclick="saveBranchRow('${b.code}',${i})">บันทึก</button></div></div>`).join('')}</div></div>`}catch(e){err(e)}}
function fillBranchGps(i){navigator.geolocation?.getCurrentPosition(p=>{$('#blat'+i).value=p.coords.latitude;$('#blng'+i).value=p.coords.longitude;toast('อ่าน GPS แล้ว')},()=>toast('อ่าน GPS ไม่ได้'),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
async function saveBranchRow(code,i){try{await api('saveBranch',state.token,{code,name:$('#bn'+i).value,lat:$('#blat'+i).value,lng:$('#blng'+i).value,radiusM:$('#br'+i).value,shiftIn:$('#bi'+i).value,shiftOut:$('#bo'+i).value,graceMin:$('#bg'+i).value,weeklyOff:$('#bw'+i).value,active:$('#ba'+i).checked});await loadBranchesMeta();toast('บันทึกสาขาแล้ว');loadSettings()}catch(e){err(e)}}
function newBranchDialog(){modal(`<div class="section-head"><h2>เพิ่มสาขา</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>รหัสสาขา 2 ตัว</label><input id="nbCode" maxlength="2" style="text-transform:uppercase"></div><div class="field"><label>ชื่อสาขา</label><input id="nbName"></div><div class="settings-grid"><div class="field"><label>เวลาเข้า</label><input id="nbIn" type="time" value="08:30"></div><div class="field"><label>เวลาออก</label><input id="nbOut" type="time" value="18:00"></div><div class="field"><label>รัศมี GPS</label><input id="nbRadius" type="number" value="100"></div><div class="field"><label>ผ่อนผันสาย</label><input id="nbGrace" type="number" value="5"></div><div class="field"><label>ละติจูด</label><input id="nbLat"></div><div class="field"><label>ลองจิจูด</label><input id="nbLng"></div></div><button class="btn full" onclick="saveNewBranch()">เพิ่มสาขา</button>`,true)}
async function saveNewBranch(){try{await api('saveBranch',state.token,{code:$('#nbCode').value.toUpperCase(),name:$('#nbName').value,lat:$('#nbLat').value,lng:$('#nbLng').value,radiusM:$('#nbRadius').value,shiftIn:$('#nbIn').value,shiftOut:$('#nbOut').value,graceMin:$('#nbGrace').value,weeklyOff:3,active:true});closeModal();await loadBranchesMeta();loadSettings()}catch(e){err(e)}}
function exportCsv(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportAttendanceCsv(){const d=window.__dayDate||state.adminDate,rows=window.__dayRows||[];exportCsv(`KL_TIME_${d}.csv`,[['วันที่','รหัส','ชื่อ','สาขา','ฝ่าย','เข้า','ออก','สาย','สถานะ'],...rows.map(r=>[d,r.userId,r.name,r.branchName||branchName(r.branchCode),r.department,r.checkIn,r.checkOut,r.lateMinutes,r.status])])}function exportPayrollCsv(){const d=window.__payroll;if(!d)return toast('ยังไม่มีข้อมูล');exportCsv(`KL_PAYROLL_${d.from}_${d.to}.csv`,[['รอบ','รหัส','ชื่อ','สาขา','ฝ่าย','ประเภท','วันมาทำงาน','วันจ่าย(รายวัน)','ขาด','ลา','สายรอบนี้(นาที)','สายสะสมเดือน(นาที)','นาทีสายที่หัก','หักมาสาย','OT(ชม.)','ฐาน','OT','เพิ่ม','หักอื่น','หักรวม','สุทธิ'],...d.rows.map(r=>[`${d.from} ถึง ${d.to}`,r.userId,r.name,r.branchName||branchName(r.branchCode),r.department,wageLabel(r.wageType),r.presentDays,r.payableDays,r.absentDays,r.leaveDays,r.lateMinutes,r.lateMonthMinutes,r.lateDeductMinutes,r.lateDeduction,r.otHours,r.basePay,r.otPay,r.addition,r.manualDeduction,r.deduction,r.netPay])])}
function modal(html,narrow=false){closeModal();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modal-card ${narrow?'narrow':''}">${html}</div></div>`)}function closeModal(){stopCam();$('#modal')?.remove()}
async function boot(){if(!validBackendUrl(backendUrl())){renderLogin();toast('ตรวจ config.js: Backend URL ไม่ถูกต้อง');return}if(state.token){try{const r=await api('resumeSession',state.token);if(['owner','accounting'].includes(r.user.role)){state.user=r.user;state.settings=r.settings;await loadBranchesMeta();renderAdmin();return}}catch(e){}localStorage.removeItem('kl_admin_token');state.token=''}renderLogin()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));boot();
</script>
