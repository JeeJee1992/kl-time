ign:center;font-size:42px;font-weight:900;letter-spacing:1px;margin:20px 0 3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions .btn{padding:14px}.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.menu-grid button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 7px;font-weight:800}.notice{padding:12px 14px;border-radius:12px;background:#f3f4f6;border:1px solid #d1d5db;font-size:13px}.notice.warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal{position:fixed;inset:0;background:rgba(17,24,39,.62);display:grid;place-items:center;padding:14px;z-index:100}.modal-card{width:min(560px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:16px}.video{aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden;position:relative}.video video,.video canvas,.photo-view{width:100%;height:100%;object-fit:cover}.face-guide{position:absolute;inset:14% 16%;border:3px solid rgba(255,255,255,.95);border-radius:44%;box-shadow:0 0 0 9999px rgba(0,0,0,.08)}.video video.mirror{transform:scaleX(-1)}.camera-tools{display:flex;gap:8px;margin-top:10px}.camera-tools>*{flex:1}.backend-note{font-size:12px;color:var(--muted);word-break:break-all}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.audit{padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:13px;line-height:1.55}.loader{position:fixed;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;z-index:200}.spinner{width:42px;height:42px;border:5px solid #d1d5db;border-top-color:#374151;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;z-index:220;max-width:min(90vw,560px);box-shadow:var(--shadow)}

<script>
const localDateKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const state={token:localStorage.getItem('kl_token')||'',user:null,settings:null,home:null,tab:'dashboard',adminDate:localDateKey(),media:null,cameraFacing:'user',syncing:false,serverAnchorEpoch:0,serverAnchorPerf:0,kioskCtx:null,faceEnroll:null,faceModelsLoaded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function backendUrl(){const cfg=String(window.KL_BACKEND_URL||'').trim();if(validBackendUrl(cfg))return cfg;return String(localStorage.getItem('kl_backend_url')||'').trim()}
function validBackendUrl(v){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(String(v||'').trim())}
function trustedGoogleOrigin(origin){try{const h=new URL(origin).hostname;return h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.googleusercontent.com')}catch(e){return false}}
function decodeRpcB64(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const raw=atob(s),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
const rpcPending=new Map();
window.addEventListener('message',ev=>{if(!trustedGoogleOrigin(ev.origin))return;const d=ev.data;if(!d||d.type!=='KL_RPC_B64')return;let msg;try{msg=decodeRpcB64(d.data)}catch(e){return}const p=rpcPending.get(msg.id);if(!p)return;clearTimeout(p.timer);rpcPending.delete(msg.id);setTimeout(()=>p.iframe&&p.iframe.remove(),300);showLoader(false);if(msg.ok)p.resolve(msg.result);else p.reject(new Error(msg.error&&msg.error.message?msg.error.message:'เกิดข้อผิดพลาดจาก Server'))});
function api(fn,...args){const url=backendUrl();if(!validBackendUrl(url))return Promise.reject(new Error('ยังไม่ได้ตั้งค่า Apps Script Web app URL'));if(!navigator.onLine)return Promise.reject(new Error('OFFLINE'));showLoader(true);return new Promise((resolve,reject)=>{const id='rpc_'+Date.now()+'_'+Math.random().toString(36).slice(2);const frame=document.createElement('iframe');frame.name='kl_rpc_'+id;frame.style.display='none';document.body.appendChild(frame);const timer=setTimeout(()=>{rpcPending.delete(id);frame.remove();showLoader(false);reject(new Error('Server ตอบกลับช้าเกินไป กรุณาลองใหม่'))},30000);rpcPending.set(id,{resolve,reject,timer,iframe:frame});const form=document.createElement('form');form.method='POST';form.action=url;form.target=frame.name;form.style.display='none';const add=(name,value)=>{const x=document.createElement('textarea');x.name=name;x.value=value;form.appendChild(x)};add('requestId',id);add('payload',JSON.stringify({id:id,action:fn,args:args}));document.body.appendChild(form);form.submit();form.remove()})}

const OFFLINE_DB='kl_time_offline_v2',OFFLINE_STORE='attendance_queue',FACE_STORE='face_templates',SNAPSHOT_KEY='kl_offline_snapshot_v2';
const FACE_API_URL='https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
const FACE_MODEL_BASE='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const FACE_ASSETS=[FACE_API_URL,FACE_MODEL_BASE+'/tiny_face_detector_model-weights_manifest.json',FACE_MODEL_BASE+'/tiny_face_detector_model-shard1',FACE_MODEL_BASE+'/face_landmark_68_model-weights_manifest.json',FACE_MODEL_BASE+'/face_landmark_68_model-shard1',FACE_MODEL_BASE+'/face_recognition_model-weights_manifest.json',FACE_MODEL_BASE+'/face_recognition_model-shard1',FACE_MODEL_BASE+'/face_recognition_model-shard2'];
function makeEventId(){return 'evt_'+Date.now()+'_'+(crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2))}
function idbOpen(){return new Promise((resolve,reject)=>{let done=false;const q=indexedDB.open(OFFLINE_DB,2),fail=(e)=>{if(done)return;done=true;reject(e instanceof Error?e:new Error(String(e||'เปิดฐานข้อมูลออฟไลน์ไม่สำเร็จ')))};const tm=setTimeout(()=>fail(new Error('ฐานข้อมูลออฟไลน์ตอบกลับช้า กรุณาปิดแท็บ KL TIME เก่าทั้งหมดแล้วเปิดใหม่')),5000);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(OFFLINE_STORE)){const s=d.createObjectStore(OFFLINE_STORE,{keyPath:'eventId'});s.createIndex('userId','userId',{unique:false});s.createIndex('createdAt','createdAt',{unique:false})}if(!d.objectStoreNames.contains(FACE_STORE)){d.createObjectStore(FACE_STORE,{keyPath:'userId'})}};q.onblocked=()=>fail(new Error('ฐานข้อมูลออฟไลน์ถูกแท็บเก่าล็อกอยู่ กรุณาปิดแท็บ KL TIME อื่นทั้งหมดแล้วเปิดใหม่'));q.onsuccess=()=>{if(done){try{q.result.close()}catch(e){}return}done=true;clearTimeout(tm);const d=q.result;d.onversionchange=()=>{try{d.close()}catch(e){}};resolve(d)};q.onerror=()=>fail(q.error||new Error('เปิดฐานข้อมูลออฟไลน์ไม่สำเร็จ'))})}

function withTimeout(p,ms,msg){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg||'ทำงานนานเกินไป')),ms))])}
async function facePut(x){const d=await idbOpen();return new Promise((resolve,reject)=>{const tx=d.transaction(FACE_STORE,'readwrite');tx.objectStore(FACE_STORE).put(x);tx.oncomplete=()=>{d.close();resolve(x)};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function faceGet(uid){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction(FACE_STORE,'readonly').objectStore(FACE_STORE).get(String(uid||'').toUpperCase());r.onsuccess=()=>{const x=r.result||null;d.close();resolve(x)};r.onerror=()=>{d.close();reject(r.error)}})}
async function faceAll(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction(FACE_STORE,'readonly').objectStore(FACE_STORE).getAll();r.onsuccess=()=>{const x=r.result||[];d.close();resolve(x)};r.onerror=()=>{d.close();reject(r.error)}})}
async function saveFaceLocal(t){if(!t||!t.userId)return;await facePut({userId:String(t.userId).toUpperCase(),descriptors:t.descriptors||[],version:t.version||'',updatedAt:t.updatedAt||new Date().toISOString()})}
async function loadFaceModels(){if(state.faceModelsLoaded)return true;if(!window.faceapi)throw new Error('โหลดระบบสแกนหน้าไม่สำเร็จ กรุณาเปิดอินเทอร์เน็ตแล้วรีเฟรช');showLoader(true);try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_BASE),faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_BASE),faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_BASE)]);state.faceModelsLoaded=true;return true}finally{showLoader(false)}}
async function cacheFaceAssets(){if(!navigator.onLine)throw new Error('ต้องออนไลน์เพื่อเตรียมโมเดลสแกนหน้าครั้งแรก');const c=await caches.open('kl-time-face-assets-v1');let ok=0;for(const url of FACE_ASSETS){try{const r=await fetch(url,{mode:'cors',cache:'reload'});if(r.ok){await c.put(url,r.clone());ok++}}catch(e){}}await loadFaceModels();return ok}
function euclid(a,b){let s=0;for(let i=0;i<Math.min(a.length,b.length);i++){const d=Number(a[i])-Number(b[i]);s+=d*d}return Math.sqrt(s)}
function localFaceMatch(desc,t){if(!t||!Array.isArray(t.descriptors)||!t.descriptors.length)return {status:'review',distance:999};let m=999;for(const r of t.descriptors)m=Math.min(m,euclid(desc,r));return {status:m<=0.60?'pass':'review',distance:m}}
async function detectFaceSample(video){await loadFaceModels();const opt=new faceapi.TinyFaceDetectorOptions({inputSize:160,scoreThreshold:.45});const r=await faceapi.detectSingleFace(video,opt).withFaceLandmarks().withFaceDescriptor();if(!r)throw new Error('ไม่พบใบหน้าชัดเจน กรุณามองกล้องและให้ใบหน้าอยู่ในกรอบ');const b=r.detection.box;return {descriptor:Array.from(r.descriptor),box:{x:b.x,y:b.y,width:b.width,height:b.height}}}
async function captureFaceProof(video,template,statusEl){if(statusEl)statusEl.textContent='กำลังสแกนใบหน้า...';const a=await detectFaceSample(video);if(statusEl)statusEl.textContent='ขยับศีรษะเล็กน้อย แล้วมองกล้องต่อ';await new Promise(r=>setTimeout(r,850));const b=await detectFaceSample(video);const dx=Math.abs((b.box.x+b.box.width/2)-(a.box.x+a.box.width/2))/Math.max(1,a.box.width);const dy=Math.abs((b.box.y+b.box.height/2)-(a.box.y+a.box.height/2))/Math.max(1,a.box.height);const ds=Math.abs(b.box.width-a.box.width)/Math.max(1,a.box.width);const movement=Math.max(dx,dy,ds)>=.018?'pass':'review';const match=localFaceMatch(b.descriptor,template);const status=(match.status==='pass'&&movement==='pass')?'pass':'review';return {descriptor:b.descriptor,liveness:movement,clientDistance:Math.round(match.distance*1000)/1000,clientStatus:status,templateVersion:template&&template.version||''}}

async function offlinePut(x){const d=await idbOpen();return new Promise((resolve,reject)=>{const tx=d.transaction(OFFLINE_STORE,'readwrite');tx.objectStore(OFFLINE_STORE).put(x);tx.oncomplete=()=>{d.close();resolve(x)};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function offlineDelete(id){const d=await idbOpen();return new Promise((resolve,reject)=>{const tx=d.transaction(OFFLINE_STORE,'readwrite');tx.objectStore(OFFLINE_STORE).delete(id);tx.oncomplete=()=>{d.close();resolve()};tx.onerror=()=>{d.close();reject(tx.error)}})}
async function offlineAll(){const d=await idbOpen();return new Promise((resolve,reject)=>{const tx=d.transaction(OFFLINE_STORE,'readonly'),r=tx.objectStore(OFFLINE_STORE).getAll();r.onsuccess=()=>{const a=r.result||[];d.close();resolve(a.sort((x,y)=>String(x.createdAt).localeCompare(String(y.createdAt))))};r.onerror=()=>{d.close();reject(r.error)}})}
async function offlineForUser(uid){return (await offlineAll()).filter(x=>String(x.userId).toUpperCase()===String(uid).toUpperCase())}
function saveSnapshot(home){if(!state.user)return;const snap={user:state.user,settings:state.settings,home:home||state.home,savedAt:new Date().toISOString()};localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(snap))}
function loadSnapshot(){try{return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'null')}catch(e){return null}}
function hmLocal(iso){const d=new Date(iso);return isNaN(d)?'--:--':d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false})}
function normalizeTimeValue(v){const s=String(v||'').trim();return s==='--:--'?'':s}
function localLate(iso){const d=new Date(iso),s=state.settings||{},shift=String(s.shiftIn||'08:30').split(':').map(Number),grace=Number(s.graceMin||5);return Math.max(0,d.getHours()*60+d.getMinutes()-(shift[0]*60+shift[1]+grace))}
function networkError(e){const m=String(e&&e.message||e||'');return m==='OFFLINE'||m.includes('ตอบกลับช้าเกินไป')||m.includes('Failed to fetch')||m.includes('NetworkError')}
function permanentOfflineError(e){const m=String(e&&e.message||e||'');return m.includes('เกิน 2 ชั่วโมง')||m.includes('เวลาบนโทรศัพท์')||m.includes('อยู่นอกพื้นที่')||m.includes('GPS ยังไม่แม่น')||m.includes('มีเวลาเข้างานอยู่แล้ว')||m.includes('มีเวลาออกงานอยู่แล้ว')||m.includes('อยู่ก่อนเวลาเข้า')}

async function captureKioskPunch(){const c=state.kioskCtx;if(!c)return;if(Date.now()>=c.deadline)return kioskPunchError(new Error('หมดเวลายืนยัน กรุณากดลงเวลาใหม่'));try{const v=$('#cam');if(!v||v.readyState<2)throw new Error('กล้องยังไม่พร้อม');const l=window.__klLoc;if(!l||Number(l.accuracy)>100)throw new Error('GPS ยังไม่พร้อม');let template=c.faceTemplate||await faceGet(c.uid);if(!template)throw new Error('ยังไม่มีข้อมูลใบหน้าของพนักงานคนนี้');const b=$('#confirmKiosk');if(b)b.disabled=true;const s=$('#gpsStatus');const faceProof=await captureFaceProof(v,template,s);const cv=document.createElement('canvas');cv.width=360;cv.height=480;cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);const photo=cv.toDataURL('image/jpeg',.58);const ev={kiosk:true,eventId:c.eventId,userId:c.uid,type:c.type,lockedAt:c.lockedAt,localDate:new Date(c.lockedAt).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}),lat:l.lat,lng:l.lng,accuracy:l.accuracy,photoDataUrl:photo,faceProof:faceProof,device:navigator.userAgent,deviceId:c.deviceId,permit:c.permit,createdAt:new Date().toISOString(),failed:false};const lockedText=kioskTimeText(c.lockedAt);if(!navigator.onLine||!c.ticket){if(!c.permit)throw new Error('ยังไม่มีสิทธิ์ออฟไลน์ของพนักงานคนนี้');await queueKioskEvent(ev);finishKioskPunch({message:faceProof.clientStatus==='pass'?'บันทึกออฟไลน์แล้ว':'บันทึกแล้ว · ใบหน้ารอตรวจสอบ',lockedTime:lockedText,user:c.user,face:{status:faceProof.clientStatus==='pass'?'ผ่าน':'ต้องตรวจสอบ'}},true);return}try{const r=await api('completeKioskPunch',c.ticket,l.lat,l.lng,l.accuracy,photo,navigator.userAgent,faceProof);if(r.home)saveKioskStatus(c.uid,r.home);finishKioskPunch(r,false)}catch(e){if(networkError(e)&&c.permit){await queueKioskEvent(ev);finishKioskPunch({message:faceProof.clientStatus==='pass'?'Server ขาดการเชื่อมต่อ · เก็บไว้รอซิงก์':'เก็บไว้รอซิงก์ · ใบหน้ารอตรวจสอบ',lockedTime:lockedText,user:c.user,face:{status:faceProof.clientStatus==='pass'?'ผ่าน':'ต้องตรวจสอบ'}},true);return}throw e}}catch(e){kioskPunchError(e);const b=$('#confirmKiosk');if(b)b.disabled=false}}
async function queueKioskEvent(ev){const all=await offlineAll(),same=all.filter(x=>x.kiosk&&!x.failed&&String(x.userId).toUpperCase()===String(ev.userId).toUpperCase()&&x.localDate===ev.localDate);if(ev.type==='in'&&same.some(x=>x.type==='in'))throw new Error('มีเวลาเข้างานออฟไลน์รอซิงก์อยู่แล้ว');if(ev.type==='out'&&same.some(x=>x.type==='out'))throw new Error('มีเวลาออกงานออฟไลน์รอซิงก์อยู่แล้ว');const st=kioskStatus(ev.userId);if(ev.type==='out'&&!same.some(x=>x.type==='in')&&!(st&&st.home&&st.home.checkIn))throw new Error('เครื่องนี้ยังไม่มีหลักฐานว่าเข้างานแล้ว จึงไม่อนุญาตออกงานออฟไลน์');await offlinePut(ev);try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}}
function finishKioskPunch(r,isOffline){clearInterval(window.__kioskCountdown);const c=state.kioskCtx;state.kioskCtx=null;stopCamera();const user=(r&&r.user)||c?.user||{};openModal(`<div class="success-box"><div class="big-ok">✓</div><h2>${esc(r.message||'ลงเวลาสำเร็จ')}</h2><div class="success-time">${esc(r.lockedTime||kioskTimeText(c.lockedAt))}</div><div class="muted">${esc(user.name||c.uid)} · ${isOffline?'ออฟไลน์ / รอซิงก์':'บันทึกแล้ว'}${r&&r.face&&r.face.status==='ต้องตรวจสอบ'?' · ⚠ ใบหน้ารอตรวจสอบ':''}</div></div>`);setTimeout(()=>{closeModal();renderKiosk()},2800)}
async function syncKioskQueue(show=true){if(state.syncing||!navigator.onLine)return;state.syncing=true;let ok=0,failed=0;try{const rows=(await offlineAll()).filter(x=>x.kiosk);for(const ev of rows){if(ev.failed){failed++;continue}try{const r=await api('syncKioskOffline',ev);if(r&&r.home)saveKioskStatus(ev.userId,r.home);await offlineDelete(ev.eventId);ok++}catch(e){if(networkError(e))break;if(permanentOfflineError(e)||String(e.message||'').includes('สิทธิ์ออฟไลน์')){ev.failed=true;ev.syncError=e.message||String(e);await offlinePut(ev);failed++;continue}throw e}}if(show&&ok)toast(`ซิงก์สำเร็จ ${ok} รายการ`)}catch(e){err(e)}finally{state.syncing=false}}
async function showKioskQueue(){const rows=(await offlineAll()).filter(x=>x.kiosk);openModal(`<div class="section-head"><h2>รายการรอซิงก์</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div>${rows.length?rows.map(x=>`<div class="offline-row ${x.failed?'offline-failed':''}"><div><b>${esc(x.userId)} · ${x.type==='in'?'เข้า':'ออก'} ${esc(kioskTimeText(x.lockedAt))}</b><div class="tiny">${esc(x.localDate)} · GPS ${Math.round(x.accuracy)} ม.${x.failed?'<br>'+esc(x.syncError||''):''}</div></div><span class="badge ${x.failed?'red':'amber'}">${x.failed?'ต้องตรวจ':'รอซิงก์'}</span></div>`).join(''):'<div class="muted">ไม่มีรายการค้าง</div>'}<button class="btn full" style="margin-top:12px" ${!navigator.onLine?'disabled':''} onclick="closeModal();syncKioskQueue(true)">ซิงก์ตอนนี้</button>`)}

function renderBackendSetup(){state.user=null;$('#app').innerHTML=`<div class="center"><div class="login"><div class="brand"><div class="logo">KL</div><div><h1>เชื่อม KL TIME</h1><div class="sub">ตั้งค่า Backend ครั้งแรก</div></div></div><div class="notice warn">วาง URL เว็บแอป Apps Script ที่ลงท้ายด้วย <b>/exec</b> แล้วทดสอบการเชื่อมต่อ</div><div class="field"><label>Apps Script Web app URL</label><input id="backendInput" value="${esc(backendUrl())}" placeholder="https://script.google.com/macros/s/.../exec"></div><button class="btn full" onclick="saveBackendAndTest()">บันทึกและทดสอบ</button><div class="backend-note" style="margin-top:12px">เมื่อตั้งค่าในไฟล์ config.js แล้ว พนักงานทุกเครื่องจะไม่ต้องกรอกหน้านี้อีก</div></div></div>`}
async function saveBackendAndTest(){const v=$('#backendInput').value.trim();if(!validBackendUrl(v)){toast('URL ต้องเป็น Web app /exec');return}localStorage.setItem('kl_backend_url',v);window.KL_BACKEND_URL=v;try{const r=await api('ping');toast('เชื่อมต่อสำเร็จ · '+r.serverTime);setTimeout(()=>boot(),500)}catch(e){err(e)}}
function showLoader(v){$('#loader').classList.toggle('hidden',!v)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.add('hidden'),2600)}
function err(e){console.error(e);toast(e.message||String(e));if((e.message||'').includes('เซสชัน')){localStorage.removeItem('kl_token');state.token='';state.user=null;renderLogin()}}
function roleLabel(r){return r==='owner'?'เจ้าของระบบ':r==='accounting'?'ฝ่ายบัญชี':'พนักงาน'}
function isAdmin(){return state.user&&['owner','accounting'].includes(state.user.role)}
function topbar(){return `<div class="topbar"><div class="top-left"><div class="mini-logo">KL</div><div><div class="top-title">KL TIME</div><div class="sub">${esc(state.user.name)} · ${roleLabel(state.user.role)}</div></div></div><div style="display:flex;gap:7px;align-items:center"><span class="net-pill ${navigator.onLine?'':'offline'}">${navigator.onLine?'● ออนไลน์':'● ออฟไลน์'}</span><button class="btn secondary hide-mobile" onclick="changePinDialog()">เปลี่ยน PIN</button><button class="btn secondary" onclick="adminLogout()">ออกจากระบบ</button></div></div>`}
function renderLogin(){state.user=null;$('#app').innerHTML=`<div class="center"><div class="login"><div class="brand"><div class="logo">KL</div><div><h1>KL TIME</h1><div class="sub">ระบบลงเวลาพนักงาน</div></div></div><div class="field"><label>รหัสพนักงาน</label><input id="uid" autocomplete="username" placeholder="เช่น KL001"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div><button class="btn full" onclick="login()">เข้าสู่ระบบ</button><div class="notice warn" style="margin-top:14px">เวลาเข้า–ออกจริงใช้เวลาจาก Server ไม่ใช่เวลาบนโทรศัพท์</div></div></div>`}
async function login(){try{const uid=$('#uid').value.trim(),pin=$('#pin').value.trim();const r=await api('login',uid,pin);state.token=r.token;state.user=r.user;state.settings=r.settings;state.home=r.home||null;localStorage.setItem('kl_token',r.token);saveSnapshot(state.home);render();setTimeout(()=>syncOfflineQueue(false),700)}catch(e){err(e)}}
async function logout(){try{if(state.user&&state.user.role==='employee'){const q=await offlineForUser(state.user.userId);if(q.some(x=>!x.failed)&&!confirm('ยังมีรายการออฟไลน์รอซิงก์ หากออกจากระบบต้องเข้าสู่บัญชีเดิมอีกครั้งเพื่อซิงก์\n\nต้องการออกจากระบบหรือไม่?'))return}if(state.token&&navigator.onLine)await api('logout',state.token)}catch(e){}localStorage.removeItem('kl_token');state.token='';state.user=null;state.home=null;renderLogin()}
async function boot(){if(!validBackendUrl(backendUrl())){renderBackendSetup();return}if(navigator.onLine)await syncServerClock();if(state.token&&navigator.onLine){try{const r=await api('resumeSession',state.token);if(['owner','accounting'].includes(r.user.role)){state.user=r.user;state.settings=r.settings;renderAdmin();return}}catch(e){}localStorage.removeItem('kl_token');state.token=''}state.user=null;renderKiosk();if(navigator.onLine)setTimeout(()=>syncKioskQueue(false),700)}
function render(){if(state.user&&isAdmin())return renderAdmin();return renderKiosk()}
function startClock(){clearInterval(window.__clock);const t=()=>{const el=$('#clock');if(el)el.textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})};t();window.__clock=setInterval(t,1000)}
async function renderEmployee(){try{let h=null;if(navigator.onLine){try{h=await api('getEmployeeHome',state.token);state.home=h;saveSnapshot(h)}catch(e){if(!networkError(e))throw e}}if(!h){const snap=loadSnapshot();h=state.home||(snap&&snap.home);if(!h)throw new Error('ไม่มีข้อมูลล่าสุดในเครื่อง กรุณาเชื่อมอินเทอร์เน็ตอย่างน้อย 1 ครั้ง')}const pending=await offlineForUser(state.user.userId);const display=mergePendingHome(h,pending);const waiting=pending.filter(x=>!x.failed).length,failed=pending.filter(x=>x.failed).length;$('#app').innerHTML=topbar()+`<div class="employee-shell">${!navigator.onLine?`<div class="offline-banner"><b>ออฟไลน์</b> — กล้องและ GPS ยังใช้ได้ ระบบจะเก็บรายการไว้ในเครื่องและซิงก์อัตโนมัติเมื่อมีอินเทอร์เน็ต</div>`:''}${waiting||failed?`<div class="sync-banner">รายการในเครื่อง: <span class="pending-count">${waiting}</span> รอซิงก์${failed?` · <span class="red-t">${failed} ต้องตรวจสอบ</span>`:''} <button class="btn secondary" style="margin-left:8px;padding:6px 10px" onclick="showOfflineQueue()">ดูรายการ</button></div>`:''}<div class="hero"><div class="person"><div class="avatar">${esc(state.user.name.slice(0,1))}</div><div><b>${esc(state.user.name)}</b><div class="muted">${esc(state.user.department)} · ${esc(state.user.userId)}</div></div></div><div class="today"><div class="today-head"><div><div class="muted">วันนี้</div><div class="date-big">${esc(display.dateLabel||h.dateLabel||localDateKey())}</div></div><span class="badge ${display.checkIn?'green':'red'}">${esc(display.status||'ยังไม่ลงเวลา')}</span></div><div class="shift"><span class="muted">กะงาน</span><b>${display.shiftIn||state.settings.shiftIn||'--:--'} - ${display.shiftOut||state.settings.shiftOut||'--:--'}</b></div><div class="time-grid"><div class="timebox"><span class="muted">เวลาเข้า</span><strong>${display.checkIn||'--:--'}</strong></div><div class="timebox"><span class="muted">เวลาออก</span><strong>${display.checkOut||'--:--'}</strong></div></div><div class="time-grid"><div class="timebox"><span class="muted">มาสาย</span><strong class="${display.lateMinutes?'red-t':'green-t'}">${display.lateMinutes||0} นาที</strong></div><div class="timebox"><span class="muted">สถานที่</span><strong style="font-size:16px">${esc(display.siteName||state.settings.siteName||'')}</strong></div></div></div><div id="clock" class="clock">--:--:--</div><div class="muted" style="text-align:center">${navigator.onLine?'เวลาลงจริงใช้เวลา Server':'โหมดออฟไลน์จะเก็บเวลาจากโทรศัพท์ + เวลาที่ Server รับตอนซิงก์'}</div><div class="actions"><button class="btn green" ${display.checkIn?'disabled':''} onclick="openCheck('in')">เข้างาน (IN)</button><button class="btn red" ${(!display.checkIn||display.checkOut)?'disabled':''} onclick="openCheck('out')">ออกงาน (OUT)</button></div></div><div class="menu-grid"><button onclick="showMyHistory()">ประวัติของฉัน</button><button onclick="showOfflineQueue()">รายการออฟไลน์</button><button onclick="changePinDialog()">เปลี่ยน PIN</button><button onclick="toast('พนักงานมองเห็นเฉพาะข้อมูลของตัวเอง')">สิทธิ์ของฉัน</button></div></div>`;startClock()}catch(e){err(e)}}
async function showMyHistory(){try{if(!navigator.onLine){const q=await offlineForUser(state.user.userId);openModal(`<div class="section-head"><h2>ประวัติการลงเวลา</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="notice warn">ออฟไลน์: แสดงเฉพาะรายการที่ยังอยู่ในเครื่อง</div>${q.length?q.map(x=>`<div class="offline-row"><div><b>${x.type==='in'?'เข้า':'ออก'} ${esc(hmLocal(x.clientCapturedAt))}</b><div class="tiny">${esc(x.localDate)}</div></div><span class="badge ${x.failed?'red':'amber'}">${x.failed?'ต้องตรวจ':'รอซิงก์'}</span></div>`).join(''):'<div class="muted">ไม่มีรายการออฟไลน์</div>'}`);return}const rows=await api('getMyHistory',state.token,60);openModal(`<div class="section-head"><h2>ประวัติการลงเวลา</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div>${rows.length?`<div class="table-wrap"><table style="min-width:680px"><thead><tr><th>วันที่</th><th>เข้า</th><th>ออก</th><th>มาสาย</th><th>สถานะ</th><th>โหมด</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.checkIn||'--:--')}</td><td>${esc(r.checkOut||'--:--')}</td><td>${r.lateMinutes} นาที</td><td>${esc(r.status)}</td><td>${(r.inMode||'').includes('offline')||(r.outMode||'').includes('offline')?'<span class="badge amber">มีออฟไลน์</span>':'ออนไลน์'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">ยังไม่มีประวัติ</div>'}`)}catch(e){err(e)}}
function changePinDialog(){openModal(`<div class="section-head"><h2>เปลี่ยน PIN</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>PIN เดิม</label><input id="oldPin" type="password" inputmode="numeric"></div><div class="field"><label>PIN ใหม่ (4-8 หลัก)</label><input id="newPin" type="password" inputmode="numeric"></div><button class="btn full" onclick="changePin()">บันทึก PIN ใหม่</button>`)}
async function changePin(){try{await api('changeMyPin',state.token,$('#oldPin').value,$('#newPin').value);closeModal();toast('เปลี่ยน PIN แล้ว')}catch(e){err(e)}}
async function openCheck(type){state.cameraFacing='user';window.__klLoc=null;openModal(`<div class="section-head"><h2>${type==='in'?'เช็กเข้างาน':'เช็กออกงาน'}</h2><button class="btn secondary" onclick="stopCamera();closeModal()">ปิด</button></div><div class="video"><video id="cam" class="mirror" autoplay playsinline muted></video><div class="face-guide"></div></div><div class="camera-tools"><button class="btn secondary" onclick="switchCamera()">สลับกล้อง หน้า/หลัง</button></div><div id="gpsStatus" class="notice" style="margin-top:10px">กำลังเปิดกล้องและตรวจ GPS...</div><button id="confirmCheck" class="btn ${type==='in'?'green':'red'} full" style="margin-top:12px" disabled onclick="captureCheck('${type}')">สแกนหน้าและยืนยัน</button>`);await startCamera();getGpsForCheck()}
async function startCamera(){stopCamera();const st=$('#gpsStatus');try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('เบราว์เซอร์ไม่รองรับกล้อง');state.media=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.cameraFacing},width:{ideal:720},height:{ideal:960}},audio:false});const v=$('#cam');v.srcObject=state.media;v.classList.toggle('mirror',state.cameraFacing==='user');if(st)st.textContent='กล้องพร้อม · กำลังอ่าน GPS...';return true}catch(e){if(st)st.textContent='เปิดกล้องไม่ได้ กรุณากดอนุญาต Camera ใน Chrome แล้วเปิดหน้านี้ใหม่';toast(e.message||'เปิดกล้องไม่ได้');return false}}
async function switchCamera(){state.cameraFacing=state.cameraFacing==='user'?'environment':'user';await startCamera()}
function getGpsForCheck(){if(!navigator.geolocation){$('#gpsStatus').textContent='อุปกรณ์ไม่รองรับ GPS';return}navigator.geolocation.getCurrentPosition(p=>{window.__klLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('#gpsStatus').textContent=`GPS พร้อม · ความแม่นยำประมาณ ${Math.round(p.coords.accuracy)} เมตร ระบบจะตรวจรัศมีซ้ำที่ Server`;$('#confirmCheck').disabled=p.coords.accuracy>100},e=>{$('#gpsStatus').textContent='อ่าน GPS ไม่ได้ กรุณาเปิด Location และอนุญาตสิทธิ์'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function captureCheck(type){try{const v=$('#cam');if(!v||v.readyState<2)throw new Error('กล้องยังไม่พร้อม');const c=document.createElement('canvas');c.width=360;c.height=480;const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);const photo=c.toDataURL('image/jpeg',.58);const l=window.__klLoc;if(!l)throw new Error('ยังไม่ได้ตำแหน่ง GPS');if(Number(l.accuracy)>100)throw new Error('GPS ยังไม่แม่นพอ ต้องไม่เกิน 100 เมตร');const eventId=makeEventId(),capturedAt=new Date().toISOString();const ev={eventId,userId:state.user.userId,type,clientCapturedAt:capturedAt,localDate:localDateKey(),lat:l.lat,lng:l.lng,accuracy:l.accuracy,photoDataUrl:photo,device:navigator.userAgent,createdAt:capturedAt,failed:false};if(!navigator.onLine){await queueOfflineAttendance(ev);stopCamera();closeModal();toast(`ออฟไลน์ · บันทึก${type==='in'?'เข้า':'ออก'}ไว้ในเครื่อง ${hmLocal(capturedAt)}`);await renderEmployee();return}try{const r=await api('checkAttendance',state.token,type,l.lat,l.lng,l.accuracy,photo,navigator.userAgent,eventId);stopCamera();closeModal();state.home=r.home||state.home;saveSnapshot(state.home);toast(`${r.message} ${r.serverTime}`);await renderEmployee()}catch(e){if(networkError(e)){await queueOfflineAttendance(ev);stopCamera();closeModal();toast(`Server ติดต่อไม่ได้ · เก็บรายการไว้ในเครื่อง ${hmLocal(capturedAt)}`);await renderEmployee();return}throw e}}catch(e){err(e)}}
function stopCamera(){if(state.media){state.media.getTracks().forEach(t=>t.stop());state.media=null}}
function renderAdmin(){$('#app').innerHTML=topbar()+`<div class="page"><div class="nav">${navBtn('dashboard','ภาพรวม')}${navBtn('records','รายการลงเวลา')}${navBtn('employees','พนักงาน')}${navBtn('audit','ประวัติแก้ไข')}${navBtn('settings','ตั้งค่า')}</div><div id="adminContent"></div></div>`;loadAdminTab()}
function navBtn(tab,label){return `<button class="${state.tab===tab?'active':''}" onclick="state.tab='${tab}';renderAdmin()">${label}</button>`}
async function loadAdminTab(){try{if(state.tab==='dashboard')return loadDashboard();if(state.tab==='records')return loadRecords();if(state.tab==='employees')return loadEmployees();if(state.tab==='audit')return loadAudit();if(state.tab==='settings')return loadSettings()}catch(e){err(e)}}
async function loadDashboard(){state.adminDate=localDateKey();const d=await api('getAdminDashboard',state.token,state.adminDate);$('#adminContent').innerHTML=`<div class="stats grid"><div class="card stat"><div class="muted">พนักงานทั้งหมด</div><div class="num">${d.stats.total}</div></div><div class="card stat"><div class="muted">เข้างานแล้ว</div><div class="num green-t">${d.stats.checkedIn}</div></div><div class="card stat"><div class="muted">ยังไม่เข้า</div><div class="num red-t">${d.stats.notIn}</div></div><div class="card stat"><div class="muted">มาสาย</div><div class="num amber-t">${d.stats.late}</div></div><div class="card stat"><div class="muted">ออกงานแล้ว</div><div class="num">${d.stats.checkedOut}</div></div></div><div class="card" style="margin-top:14px"><div class="section-head"><h2>การลงเวลา ${esc(d.date)}</h2><button class="btn secondary" onclick="exportCsvCurrent()">ส่งออก CSV</button></div>${attendanceTable(d.rows,d.date)}</div>`;window.__currentRows=d.rows;window.__currentDate=d.date}
async function loadRecords(){const d=await api('getAdminAttendance',state.token,state.adminDate);$('#adminContent').innerHTML=`<div class="card"><div class="section-head"><h2>รายการลงเวลา</h2><div class="row" style="max-width:390px"><input id="datePick" type="date" value="${esc(state.adminDate)}"><button class="btn" onclick="changeAdminDate()">ดูวันที่</button></div></div>${attendanceTable(d.rows,d.date)}</div>`;window.__currentRows=d.rows;window.__currentDate=d.date}
function changeAdminDate(){state.adminDate=$('#datePick').value;loadRecords()}
function attendanceTable(rows,date){return `<div class="table-wrap"><table><thead><tr><th>พนักงาน</th><th>ฝ่าย</th><th>เข้า</th><th>ออก</th><th>มาสาย</th><th>สถานะ</th><th>ใบหน้า</th><th>หลักฐาน</th><th>จัดการ</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="sub">${esc(r.userId)}</div></td><td>${esc(r.department)}</td><td>${esc(r.checkIn||'--:--')}</td><td>${esc(r.checkOut||'--:--')}</td><td>${r.lateMinutes?`<span class="badge amber">${r.lateMinutes} นาที</span>`:'0 นาที'}</td><td><span class="badge ${r.checkIn?'green':'red'}">${esc(r.status)}</span> ${((r.inMode||'').includes('offline')||(r.outMode||'').includes('offline'))?'<span class="badge amber">ออฟไลน์</span>':''}</td><td>${(r.inFaceStatus==='ต้องตรวจสอบ'||r.outFaceStatus==='ต้องตรวจสอบ')?'<span class="badge red">ต้องตรวจสอบ</span>':((r.inFaceStatus||r.outFaceStatus)?'<span class="badge green">ผ่าน</span>':'-')}</td><td>${r.inPhotoId?`<button class="btn secondary" onclick="viewPhoto('${r.inPhotoId}')">รูปเข้า</button>`:''} ${r.outPhotoId?`<button class="btn secondary" onclick="viewPhoto('${r.outPhotoId}')">รูปออก</button>`:''}</td><td><button class="btn secondary" onclick="editAttendanceEncoded('${encodeURIComponent(JSON.stringify({userId:r.userId,name:r.name,date,checkIn:r.checkIn,checkOut:r.checkOut}))}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`}
async function viewPhoto(id){try{const src=await api('getEvidencePhoto',state.token,id);openModal(`<div class="section-head"><h2>รูปหลักฐาน</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><img class="photo-view" style="height:auto;border-radius:14px" src="${src}">`)}catch(e){err(e)}}
function editAttendanceEncoded(encoded){editAttendance(decodeURIComponent(encoded))}
function editAttendance(json){const r=JSON.parse(json);openModal(`<div class="section-head"><h2>แก้ไขเวลา · ${esc(r.name)}</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="notice warn">ทุกการแก้ไขจะบันทึกชื่อผู้แก้ เวลาเดิม เวลาใหม่ และเหตุผล</div><div class="field"><label>วันที่</label><input id="eDate" type="date" value="${esc(r.date)}" disabled></div><div class="row"><div class="field"><label>เวลาเข้า</label><input id="eIn" type="time" value="${esc(r.checkIn||'')}"></div><div class="field"><label>เวลาออก</label><input id="eOut" type="time" value="${esc(r.checkOut||'')}"></div></div><div class="field"><label>เหตุผลในการแก้ไข *</label><textarea id="eReason" rows="3" placeholder="เช่น พนักงานแจ้งเครื่องมีปัญหาและตรวจสอบหลักฐานแล้ว"></textarea></div><button class="btn full" onclick="saveEdit('${esc(r.userId)}')">บันทึกการแก้ไข</button>`)}
async function saveEdit(uid){try{await api('adminEditAttendance',state.token,{userId:uid,date:$('#eDate').value,checkIn:$('#eIn').value,checkOut:$('#eOut').value,reason:$('#eReason').value});closeModal();toast('แก้ไขและบันทึกประวัติแล้ว');loadAdminTab()}catch(e){err(e)}}
async function loadEmployees(){const rows=await api('getEmployees',state.token);$('#adminContent').innerHTML=`<div class="card"><div class="section-head"><h2>ข้อมูลพนักงาน</h2><div class="row" style="flex:0 0 auto"><button class="btn secondary" onclick="prepareKioskOffline()">เตรียมเครื่องออฟไลน์</button><button class="btn" onclick="addEmployeeDialog()">+ เพิ่มพนักงาน</button></div></div><div class="notice" style="margin-bottom:12px">ใบหน้าเป็นข้อมูลชีวมิติ · ลงทะเบียนโดยคุณ/บัญชีเท่านั้น และ Face Template จะไม่ถูกเก็บบน GitHub</div><div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ฝ่าย</th><th>ใบหน้า</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.userId)}</td><td>${esc(r.name)}</td><td>${esc(r.department)}</td><td>${r.faceRegistered?'<span class="badge green">ลงทะเบียนแล้ว</span>':'<span class="badge amber">ยังไม่มี</span>'}</td><td><span class="badge ${r.active?'green':'red'}">${r.active?'ใช้งาน':'ปิดใช้งาน'}</span></td><td><button class="btn secondary" onclick="faceEnrollDialog('${r.userId}','${esc(r.name)}')">${r.faceRegistered?'ลงทะเบียนหน้าใหม่':'ลงทะเบียนใบหน้า'}</button> ${r.faceRegistered?`<button class="btn secondary" onclick="clearFace('${r.userId}')">ลบใบหน้า</button>`:''} <button class="btn secondary" onclick="resetPinDialog('${r.userId}','${esc(r.name)}')">รีเซ็ต PIN</button> <button class="btn ${r.active?'red':'green'}" onclick="toggleEmployee('${r.userId}',${!r.active})">${r.active?'ปิด':'เปิด'}ใช้งาน</button></td></tr>`).join('')}</tbody></table></div></div>`}

async function faceEnrollDialog(id,name){try{await loadFaceModels();state.faceEnroll={userId:id,name:name,samples:[]};state.cameraFacing='user';openModal(`<div class="section-head"><h2>ลงทะเบียนใบหน้า · ${esc(name)}</h2><button class="btn secondary" onclick="cancelFaceEnroll()">ปิด</button></div><div class="notice warn">เก็บ Face Template 3 ครั้ง: มองตรง → หันซ้ายเล็กน้อย → หันขวาเล็กน้อย</div><div class="video" style="margin-top:10px"><video id="cam" class="mirror" autoplay playsinline muted></video><div class="face-guide"></div></div><div id="faceEnrollStatus" class="notice" style="margin-top:10px">ครั้งที่ 1/3 · มองตรง</div><button id="faceEnrollBtn" class="btn green full" style="margin-top:10px" onclick="captureFaceEnroll()">จับภาพครั้งที่ 1</button>`);await startCamera()}catch(e){err(e)}}
function cancelFaceEnroll(){state.faceEnroll=null;stopCamera();closeModal()}
async function captureFaceEnroll(){const f=state.faceEnroll;if(!f)return;const b=$('#faceEnrollBtn'),st=$('#faceEnrollStatus');try{b.disabled=true;st.textContent='กำลังอ่านใบหน้า...';const s=await detectFaceSample($('#cam'));f.samples.push(s.descriptor);if(f.samples.length<3){const guide=f.samples.length===1?'หันซ้ายเล็กน้อย':'หันขวาเล็กน้อย';st.textContent=`ครั้งที่ ${f.samples.length+1}/3 · ${guide}`;b.textContent=`จับภาพครั้งที่ ${f.samples.length+1}`;b.disabled=false;return}st.textContent='กำลังบันทึก Face Template...';const r=await api('saveFaceTemplate',state.token,f.userId,f.samples);await saveFaceLocal({userId:f.userId,descriptors:f.samples,version:r.version||'local',updatedAt:r.updatedAt||new Date().toISOString()});stopCamera();closeModal();state.faceEnroll=null;toast('ลงทะเบียนใบหน้าเรียบร้อย');loadEmployees()}catch(e){st.textContent=e.message||String(e);b.disabled=false}}
async function clearFace(id){if(!confirm('ลบ Face Template ของ '+id+' ?'))return;try{await api('clearFaceTemplate',state.token,id);toast('ลบ Face Template แล้ว');loadEmployees()}catch(e){err(e)}}
async function prepareKioskOffline(){if(!navigator.onLine){toast('ต้องออนไลน์เพื่อเตรียมเครื่อง');return}if(!confirm('ดาวน์โหลดข้อมูลยืนยัน PIN แบบ hash และ Face Template ของพนักงานที่ลงทะเบียนแล้วมาไว้ในเครื่องนี้สำหรับใช้ออฟไลน์ 24 ชั่วโมง?'))return;try{showLoader(true);await cacheFaceAssets();const r=await api('prepareKioskOfflineBundle',state.token,kioskDeviceId());for(const c of r.employees||[]){const t=c.faceTemplate;const cred=Object.assign({},c);delete cred.faceTemplate;saveKioskCredential(cred);if(t)await saveFaceLocal(t)}toast(`เตรียมเครื่องออฟไลน์แล้ว ${r.employees.length} คน · ใช้ได้ ${r.hours} ชั่วโมง`)}catch(e){err(e)}finally{showLoader(false)}}

function addEmployeeDialog(){openModal(`<div class="section-head"><h2>เพิ่มพนักงาน</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>รหัสพนักงาน</label><input id="aId" placeholder="เช่น KL005"></div><div class="field"><label>ชื่อ</label><input id="aName"></div><div class="field"><label>ฝ่าย</label><input id="aDept" placeholder="เช่น ฝ่ายผลิต"></div><div class="field"><label>PIN เริ่มต้น 4-8 หลัก</label><input id="aPin" type="password" inputmode="numeric"></div><button class="btn full" onclick="addEmployee()">เพิ่มพนักงาน</button>`)}
async function addEmployee(){try{await api('addEmployee',state.token,{userId:$('#aId').value,name:$('#aName').value,department:$('#aDept').value,pin:$('#aPin').value});closeModal();toast('เพิ่มพนักงานแล้ว');loadEmployees()}catch(e){err(e)}}
function resetPinDialog(id,name){openModal(`<div class="section-head"><h2>รีเซ็ต PIN · ${esc(name)}</h2><button class="btn secondary" onclick="closeModal()">ปิด</button></div><div class="field"><label>PIN ใหม่ 4-8 หลัก</label><input id="rPin" type="password" inputmode="numeric"></div><button class="btn full" onclick="resetPin('${id}')">บันทึก</button>`)}
async function resetPin(id){try{await api('resetEmployeePin',state.token,id,$('#rPin').value);closeModal();toast('รีเซ็ต PIN แล้ว')}catch(e){err(e)}}
async function toggleEmployee(id,active){if(!confirm(`${active?'เปิด':'ปิด'}ใช้งาน ${id} ?`))return;try{await api('setEmployeeActive',state.token,id,active);toast('เปลี่ยนสถานะแล้ว');loadEmployees()}catch(e){err(e)}}
async function loadAudit(){const rows=await api('getAuditLog',state.token,200);$('#adminContent').innerHTML=`<div class="card"><div class="section-head"><h2>ประวัติแก้ไข / การใช้งาน</h2></div>${rows.length?rows.map(r=>`<div class="audit"><b>${esc(r.action)}</b> · ${esc(r.timestamp)}<br><span class="muted">โดย ${esc(r.actor)} · ${esc(r.target)} — ${esc(r.detail)}</span></div>`).join(''):'<div class="muted">ยังไม่มีประวัติ</div>'}</div>`}
function loadSettings(){const s=state.settings;$('#adminContent').innerHTML=`<div class="notice">หน้านี้เห็นเฉพาะ <b>เจ้าของระบบ</b> และ <b>ฝ่ายบัญชี</b></div><div class="card" style="margin-top:12px"><div class="section-head"><h2>ตั้งค่าการลงเวลา</h2></div><div class="settings-grid"><div class="field"><label>ชื่อสถานที่</label><input id="sName" value="${esc(s.siteName||'')}"></div><div class="field"><label>รัศมีที่อนุญาต (เมตร)</label><input id="sRadius" type="number" min="10" max="1000" value="${s.radiusM}"></div><div class="field"><label>เวลาเข้างาน</label><input id="sIn" type="time" value="${esc(s.shiftIn)}"></div><div class="field"><label>เวลาออกงาน</label><input id="sOut" type="time" value="${esc(s.shiftOut)}"></div><div class="field"><label>ผ่อนผันมาสาย (นาที)</label><input id="sGrace" type="number" min="0" max="120" value="${s.graceMin}"></div><div></div><div class="field"><label>ละติจูด</label><input id="sLat" value="${esc(s.siteLat||'')}"></div><div class="field"><label>ลองจิจูด</label><input id="sLng" value="${esc(s.siteLng||'')}"></div></div><div class="row"><button class="btn secondary" onclick="fillCurrentGps()">ใช้ GPS ปัจจุบันเป็นจุดบริษัท</button><button class="btn" onclick="saveSettings()">บันทึกการตั้งค่า</button></div></div>`}
function fillCurrentGps(){if(!navigator.geolocation)return toast('อุปกรณ์ไม่รองรับ GPS');navigator.geolocation.getCurrentPosition(p=>{$('#sLat').value=p.coords.latitude;$('#sLng').value=p.coords.longitude;toast(`อ่าน GPS แล้ว accuracy ${Math.round(p.coords.accuracy)} เมตร`)},e=>toast('อ่าน GPS ไม่ได้'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function saveSettings(){try{const r=await api('saveSettings',state.token,{siteName:$('#sName').value,siteLat:$('#sLat').value,siteLng:$('#sLng').value,radiusM:$('#sRadius').value,shiftIn:$('#sIn').value,shiftOut:$('#sOut').value,graceMin:$('#sGrace').value});state.settings=r.settings;toast('บันทึกการตั้งค่าแล้ว')}catch(e){err(e)}}
function exportCsvCurrent(){const rows=window.__currentRows||[],date=window.__currentDate||state.adminDate;const data=[['วันที่','รหัสพนักงาน','ชื่อ','ฝ่าย','เวลาเข้า','เวลาออก','มาสาย(นาที)','สถานะ'],...rows.map(r=>[date,r.userId,r.name,r.department,r.checkIn||'',r.checkOut||'',r.lateMinutes,r.status])];const csv='\uFEFF'+data.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`KL_TIME_${date}.csv`;a.click();URL.revokeObjectURL(url)}
function openModal(html){closeModal();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modal-card">${html}</div></div>`)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
boot();
</script>
</body>
</html>
